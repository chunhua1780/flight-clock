<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Flight Clock</title>
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icon-180.png">
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#000;transition:opacity 2s ease}
</style>
</head>
<body>
<script>
/* 简洁版外壳：加载 ../app.html?edition=lite；有新版本时后台加载好再淡入替换 */
(function () {
  var cur = null, ver = null;
  function load(v) {
    var q = new URLSearchParams(location.search);
    q.set('embed', '1'); q.set('edition', 'lite');
    if (v) q.set('v', v);
    var f = document.createElement('iframe');
    f.setAttribute('allow', 'fullscreen; screen-wake-lock; autoplay');
    f.setAttribute('allowfullscreen', '');
    f.src = '../app.html?' + q.toString();
    if (!cur) { cur = f; document.body.appendChild(f); return; }
    f.style.opacity = '0'; f.style.pointerEvents = 'none';
    document.body.appendChild(f);
    f.onload = function () {
      setTimeout(function () {
        f.style.opacity = '1'; f.style.pointerEvents = '';
        var old = cur; cur = f;
        setTimeout(function () { if (old && old.parentNode) old.parentNode.removeChild(old); }, 2500);
      }, 12000);
    };
  }
  function check(first) {
    fetch('../version.txt?_=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.text() : ''; })
      .then(function (v) {
        v = (v || '').trim();
        if (first) { ver = v || null; load(v); return; }
        if (v && v.length < 40 && v !== ver) { ver = v; load(v); }
      })
      .catch(function () { if (first) load(''); });
  }
  check(true);
  setInterval(function () { check(false); }, 10 * 60 * 1000);
})();
</script>
</body>
</html>
