<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b1220">
<title>Flight Assist</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="stylesheet" href="../vendor/leaflet/leaflet.css">
<style>
:root{--bg:#0b1220;--panel:#111a2b;--line:#22304a;--text:#e9eef7;--dim:#8d9ab3;--gold:#e2b964;--green:#3fcf7f;--amber:#f3b13c;--red:#ff5d55;--blue:#6fb4ff;
  --top:#0e1626;--btn:#16223a;--card:#0f182a;--input:#0b1220;--hud:rgba(10,16,30,.88);--sum:#13213a;--on:#24375a;--wp:#9fb0cc;--sh:0 0 3px #000;--sea:#0b1220;--fir:#e26bff}
:root[data-theme=light]{--bg:#e9eef5;--panel:#ffffff;--line:#c9d3e2;--text:#0f1b2d;--dim:#56657e;--gold:#a8740d;--green:#16924a;--amber:#b97700;--red:#d0302a;--blue:#1f6fd1;
  --top:#f7f9fc;--btn:#eef2f8;--card:#f8fafd;--input:#ffffff;--hud:rgba(255,255,255,.93);--sum:#e6eefb;--on:#d4e2fb;--wp:#46597a;--sh:0 0 3px #fff,0 0 2px #fff;--sea:#cfe0f0;--fir:#b01fd6}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif;overflow:hidden;-webkit-text-size-adjust:100%}
.num{font-variant-numeric:tabular-nums}
button{font-family:inherit}
#app{position:fixed;inset:0;display:grid;grid-template-columns:minmax(0,1fr) var(--sideW,42%);grid-template-rows:auto minmax(0,1fr)}
#app.noside{grid-template-columns:minmax(0,1fr) 0}
#app.noside #side{display:none}
@media (orientation:portrait){#app{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr) var(--sideH,45%)}#app.noside{grid-template-rows:auto minmax(0,1fr) 0}}
#side{position:relative}
#split{position:absolute;left:-7px;top:0;bottom:0;width:14px;cursor:col-resize;z-index:900;touch-action:none;display:flex;align-items:center;justify-content:center}
#split i{display:block;width:5px;height:54px;border-radius:3px;background:var(--line);transition:background .2s}
#split:hover i,#split.on i{background:var(--gold)}
@media (orientation:portrait){#split{left:0;right:0;top:-7px;bottom:auto;width:auto;height:14px;cursor:row-resize}#split i{width:54px;height:5px}}
/* 开关 */
.sw{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--dim);cursor:pointer;user-select:none;-webkit-user-select:none;white-space:nowrap}
.sw b{position:relative;width:34px;height:20px;border-radius:10px;background:#46526a;transition:background .2s;flex:none}
.sw b:after{content:'';position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.4);transition:transform .2s}
.sw.on b{background:var(--green)}.sw.on b:after{transform:translateX(14px)}
.sw.on{color:var(--text)}
@media (max-width:980px){#top{flex-wrap:wrap!important;row-gap:6px}#top .rt{display:none}.sw .en{display:none}#top{min-width:0}}
#app>*{min-width:0}
#swbox{display:flex;gap:12px;align-items:center}
/* 航路点列（地图右边） */
#wpcol{position:absolute;right:0;top:0;bottom:0;width:178px;z-index:550;background:var(--hud);border-left:1px solid var(--line);display:none;flex-direction:column;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#mapwrap.wpon #wpcol{display:flex}
#mapwrap.wpon #b-rings,#mapwrap.wpon #recenter,#mapwrap.wpon #firpop,#mapwrap.wpon #srch{right:188px}
#mapwrap.wpon #b-srch{right:274px}
#mapwrap.wpon #hud{right:188px}
#wpcol .hd{font-size:11px;color:var(--dim);letter-spacing:.06em;padding:8px 10px 4px}
#wplist{flex:1;overflow:hidden;position:relative;padding:0 6px 8px}
.wr{display:flex;align-items:center;gap:6px;padding:5px 6px;border-radius:8px;margin:2px 0;font-size:12.5px;cursor:pointer;will-change:transform}
.wr .n{font-weight:800;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.wr .t{font-variant-numeric:tabular-nums;color:var(--dim);font-size:11.5px}
.wr .m{font-size:9.5px;font-weight:700;border:1px solid currentColor;border-radius:3px;padding:0 2px}
.wr.next{background:linear-gradient(135deg,rgba(226,185,100,.28),rgba(226,185,100,.08));border:1px solid var(--gold);padding:9px 8px;margin:4px 0 6px;flex-wrap:wrap}
.wr.next .n{font-size:18px;color:var(--gold)}
.wr.next .t{font-size:13px;color:var(--text)}
.wr.next .cd{width:100%;font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
.wr.firw .n{color:var(--fir)}
.wr.past{opacity:.38}
.wr.past .n{font-weight:600}
.wsep{font-size:10px;color:var(--dim);text-align:center;margin:6px 0 2px;letter-spacing:.1em;border-top:1px dashed var(--line);padding-top:4px}
@keyframes drop{0%{transform:translateY(-160px);opacity:.1}70%{transform:translateY(6px)}100%{transform:none}}
.wr.dropin{animation:drop .9s cubic-bezier(.3,1.4,.5,1)}
@keyframes pop{0%{transform:scale(.85);opacity:.3}100%{transform:none;opacity:1}}
.wr.next.popin{animation:pop .6s ease-out}
/* 顶栏 */
#top{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:max(8px,env(safe-area-inset-top)) 14px 8px;background:var(--top);border-bottom:1px solid var(--line);flex-wrap:nowrap}
#top>*{flex-shrink:0}#top .rt{flex-shrink:1}#top .fl{white-space:nowrap}
#top .fl{font-size:20px;font-weight:700;color:var(--gold)}
#top .rt{font-size:14px;color:var(--dim);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:0 1 auto}
#top .btn .en{display:none}
#top .sp{flex:1}
#utc{font-size:22px;font-weight:600}
#utc small{font-size:12px;color:var(--dim);margin-left:4px}
.btn{border:1px solid var(--line);background:var(--btn);color:var(--text);border-radius:10px;padding:8px 12px;font-size:14px;cursor:pointer}
.btn.pri{background:var(--gold);border-color:var(--gold);color:#1a1204;font-weight:700}
.btn.sm{padding:5px 9px;font-size:12px}
.pill{display:inline-block;border-radius:6px;padding:1px 6px;font-size:11px;font-weight:700;letter-spacing:.03em;vertical-align:1px}
/* 地图 */
#mapwrap{position:relative;min-height:0}
#map{position:absolute;inset:0;background:var(--sea)}
.leaflet-container{background:var(--sea);font-family:inherit}
.wp{color:var(--wp);font-size:10px;font-weight:600;background:none;border:none;box-shadow:none;padding:0;text-shadow:var(--sh)}
.wp:before{display:none}
#map.far .wp{display:none}
.wp.firwp{color:var(--fir);font-size:11.5px;font-weight:900}
.mora{font-size:9.5px;font-weight:700;color:#7cc8ff;border:1px solid currentColor;border-radius:3px;padding:0 2px;margin-left:2px}
.mora.hi{color:#ffab2e;background:rgba(255,171,46,.15)}.mora.xh{color:#ff5a4f;background:rgba(255,90,79,.15)}
:root[data-theme=light] .mora{color:#2b8fd8}:root[data-theme=light] .mora.hi{color:#b86e00}:root[data-theme=light] .mora.xh{color:#c62d24}
#b-srch{position:absolute;right:96px;top:10px;z-index:500}
#srch{position:absolute;right:10px;top:48px;z-index:660;width:min(330px,80%);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;box-shadow:0 4px 18px rgba(0,0,0,.35);display:none}
#srch input{width:100%;box-sizing:border-box;background:var(--input);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:16px;text-transform:uppercase}
#srch .res{max-height:220px;overflow:auto;margin-top:6px}
#srch .r{display:flex;gap:8px;align-items:center;padding:6px 4px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px}
#srch .r b{width:70px}#srch .r .tm{color:var(--dim);font-variant-numeric:tabular-nums;flex:1}
#srch .ato{display:flex;gap:6px;align-items:center;margin-top:8px}
#srch .ato input{width:90px;text-align:center}
#fixbar{position:absolute;left:10px;bottom:132px;z-index:500;display:none;background:var(--hud);border:1px solid var(--line);border-radius:10px;padding:5px 9px;font-size:12px}
#atd.dirty{border-color:var(--amber);box-shadow:0 0 0 2px rgba(243,177,60,.35)}
.apl{background:var(--hud);border:1px solid var(--line);color:var(--text);font-size:11px;font-weight:700;padding:1px 4px;border-radius:4px;box-shadow:none}
.apl:before{display:none}
#hud{position:absolute;left:10px;right:10px;bottom:10px;display:flex;gap:8px;flex-wrap:wrap;z-index:500;pointer-events:none}
#hud .c{background:var(--hud);border:1px solid var(--line);border-radius:10px;padding:6px 10px;pointer-events:auto}
#hud .k{font-size:10px;color:var(--dim);letter-spacing:.06em}
#hud .v{font-size:17px;font-weight:600}
#recenter{position:absolute;right:10px;top:48px;z-index:500;display:none}
/* 右侧面板 */
#side{min-height:0;display:flex;flex-direction:column;border-left:1px solid var(--line);background:var(--panel)}
@media (orientation:portrait){#side{border-left:none;border-top:1px solid var(--line)}}
#tabs{display:flex;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line)}
#tabs .btn.on{background:var(--on);border-color:#3a5584}
#list{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:6px 8px 20px}
.ap{border:1px solid var(--line);border-radius:12px;padding:9px 11px;margin:6px 0;background:var(--card);cursor:pointer}
.ap .h{display:flex;align-items:baseline;gap:8px}
.ap .id{font-size:17px;font-weight:700}
.ap .nm{font-size:12px;color:var(--dim);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ap .d{font-size:13px;color:var(--text);white-space:nowrap}
.ap .w{font-size:13px;margin-top:4px;line-height:1.45}
.ap .n{font-size:12px;margin-top:3px;line-height:1.45}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}
.g{background:var(--green)}.a{background:var(--amber)}.r{background:var(--red)}.x{background:#5b6680}
.t-red{color:var(--red)}.t-amber{color:var(--amber)}.t-info{color:var(--dim)}
.tag{border:1px solid #3a4b6c;color:#bcd0f0;border-radius:5px;font-size:10.5px;padding:0 5px;margin-left:4px;white-space:nowrap}
.cat{display:inline-block;min-width:26px;text-align:center;border-radius:6px;padding:1px 5px;font-size:12px;font-weight:800;color:#0b1220;vertical-align:2px}
.cat.cD{background:#14a04f;color:#fff}.cat.cA1{background:#8ff0a8}.cat.cA2{background:#f7dc2a}.cat.cCA{background:#ff8c1a}.cat.cEA{background:#ff3b30;color:#fff}.cat.cX{background:#6d0000;color:#fff}.cat.cN{background:#4a5570;color:#c9d3e6}
#legend{position:absolute;left:10px;top:10px;z-index:500;background:var(--hud);border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:11px;line-height:1.7;color:var(--dim)}
#legend .cat{font-size:10px;min-width:22px;margin-right:3px}
#map.far5 .apl.x5{display:none}
.hint{font-size:12px;margin-top:3px;line-height:1.45}
/* 详情 */
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:2000}
#sheet.open{display:block}
#sheet .in{position:absolute;right:0;top:0;bottom:0;width:min(560px,100%);background:var(--card);border-left:1px solid var(--line);overflow:auto;padding:16px 16px 40px;-webkit-overflow-scrolling:touch}
#sheet h2{margin:0 0 2px;font-size:22px}
#sheet h3{margin:16px 0 6px;font-size:13px;color:var(--dim);letter-spacing:.08em;font-weight:600}
#sheet .raw{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--wp);white-space:pre-wrap;background:var(--input);border-radius:8px;padding:8px;margin-top:4px}
#sheet table{border-collapse:collapse;width:100%;font-size:13px}
#sheet td,#sheet th{border-bottom:1px solid var(--line);padding:5px 4px;text-align:left}
details summary{cursor:pointer;color:var(--blue);font-size:12px;margin-top:3px}
/* 载入 */
#load{position:fixed;inset:0;z-index:3000;background:var(--bg);display:none;align-items:center;justify-content:center;padding:20px}
#load.open{display:flex}
#load .in{width:min(640px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}
#load h1{margin:0 0 6px;font-size:22px}
#load p{color:var(--dim);font-size:14px;line-height:1.55;margin:6px 0}
#load textarea{width:100%;height:150px;background:var(--input);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
#load input[type=text]{background:var(--input);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:15px;width:100%}
#load .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;align-items:center}
#msg{font-size:13px;color:var(--amber);margin-top:8px;white-space:pre-wrap}
#atdbox{display:flex;align-items:center;gap:6px}
#atd{width:86px;background:var(--input);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:16px;text-align:center}
.disc{font-size:10.5px;color:#6f7d98;padding:6px 10px;border-top:1px solid var(--line)}
.en{color:#8d9ab3;font-size:.86em;font-weight:400;margin-left:4px}
div.en,.wl .en{display:block;margin-left:0}
#tabs .btn .en{display:block;margin-left:0;font-size:10px}
.sum{border:1px solid #3a5584;background:var(--sum);border-radius:12px;padding:9px 11px;margin:6px 0 4px}
.sum .t{font-size:14px;font-weight:700}
.sum .s{font-size:12px;color:var(--dim);margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:4px 7px;font-size:13px;font-weight:700;cursor:pointer}
.chip small{font-weight:400;color:var(--dim);font-size:11px}
.ap.cur{box-shadow:0 0 0 1.5px #ffffffaa inset}
.rlab{color:#e2b964;font-size:11px;font-weight:700;white-space:nowrap;text-shadow:var(--sh)}
.rlab.r2{color:#9fb0cc}
#b-upd{flex:none;display:flex;align-items:center;gap:6px;border:1.5px solid var(--green);background:transparent;color:var(--green);border-radius:20px;padding:6px 12px 6px 10px;font-size:15px;font-weight:700;cursor:pointer;margin-right:14px}
#b-upd span{font-size:12px}
#b-upd.busy{opacity:.6}
#b-upd.busy::first-letter{display:inline-block}
#firpop{position:absolute;right:10px;top:86px;z-index:640;width:min(400px,62%);background:var(--hud);border:1.5px solid #d63bff;border-radius:14px;padding:10px 12px;box-shadow:0 4px 18px rgba(0,0,0,.35);display:none;font-size:13px}
#firpop .t{font-weight:800;font-size:14px;color:var(--fir);display:flex;align-items:center;gap:8px}
#firpop .t .x{margin-left:auto;cursor:pointer;color:var(--dim);font-size:18px}
#firpop .it{margin-top:5px;line-height:1.4}
#firpop .ft{margin-top:7px;display:flex;gap:8px}
#hud .c.cur{cursor:pointer;border-color:#7d5a99}
.firrow{cursor:pointer}
#updbar{position:absolute;left:50%;transform:translateX(-50%);bottom:84px;z-index:650;background:var(--green);color:#06210f;font-weight:800;border-radius:12px;padding:9px 16px;font-size:14px;cursor:pointer;box-shadow:0 2px 12px rgba(0,0,0,.4);white-space:nowrap}
#syncst{font-size:13px;margin-top:6px}
#b-rings{position:absolute;right:10px;top:10px;z-index:500}
#b-rings.off{opacity:.55}
#prev{position:absolute;left:50%;transform:translateX(-50%);top:10px;z-index:600;display:none;background:var(--hud);border:1px solid #4d6fae;border-radius:12px;padding:6px 10px;font-size:13px;white-space:nowrap}
#prev .btn{margin-left:6px}
.firm{display:flex;align-items:center;gap:5px;white-space:nowrap}
.firm i{display:flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:#d63bff;border:2.5px solid #fff;box-shadow:0 0 0 3px rgba(214,59,255,.35),0 0 10px #d63bff;font-style:normal;font-size:13px;line-height:1}
.firm span{background:#d63bff;color:#fff;font-size:11px;font-weight:800;border-radius:6px;padding:2px 6px;box-shadow:0 1px 4px #000}
.firm span small{font-weight:600;opacity:.85}
#hud .c.fir{border-color:#d63bff}
#hud .c.fir.soon{background:#7a1f99;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{background:#d63bff}}
.apl.hot{font-size:12px;border:none;box-shadow:0 1px 4px #000}
.dpm{color:#ff5d55;font-weight:900;font-size:13px;text-shadow:var(--sh)}
.tr{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line);padding:6px 4px;cursor:pointer;font-size:13px}
.tr .tm{font-variant-numeric:tabular-nums;color:var(--dim);width:46px;flex:none}
.tr .ic{font-weight:800;font-size:14px;width:44px;flex:none}
.tr .nm2{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--dim);font-size:12px}
.tr .xd{font-variant-numeric:tabular-nums;font-size:12px;color:var(--dim);white-space:nowrap}
.tr.past{opacity:.4}
.tr.in1{background:var(--sum)}
.tr .hn{font-size:11px}
.nowbar{background:var(--gold);color:#1a1204;font-weight:800;font-size:12px;border-radius:6px;padding:3px 8px;margin:4px 0}
.firrow{font-size:11.5px;color:#f2b8ff;padding:3px 4px;border-bottom:1px dashed #5a3a6a}
.disc a{color:var(--gold);font-weight:700;text-decoration:none;font-size:13px;float:right;margin-left:8px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:4000;background:var(--btn);border:1px solid #3a5584;border-radius:10px;padding:8px 14px;font-size:14px;display:none}
/* OFP 解读 */
#dec{position:fixed;inset:0;z-index:3400;background:var(--bg);display:none;flex-direction:column}
#dec.open{display:flex}
#dec .bar{display:flex;align-items:center;gap:10px;padding:max(8px,env(safe-area-inset-top)) 12px 8px;background:var(--top);border-bottom:1px solid var(--line)}
#dec-q{width:150px;background:var(--input);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:14px;text-transform:uppercase}
#dec-body{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:18px 10px 48vh;background:#5b6474}
#dec-body .paper{max-width:760px;margin:0 auto;background:#fdfbf4;color:#1a1a1a;box-shadow:0 3px 18px rgba(0,0,0,.35);padding:26px 28px;font-family:"Courier New",ui-monospace,Menlo,monospace;font-size:12.5px;line-height:1.5;white-space:pre;overflow-x:auto;border-radius:2px}
#dec-body .pgbrk{height:0;border-top:2px dashed #b8b2a2;margin:14px -28px;position:relative}
#dec-body .pgbrk span{position:absolute;right:10px;top:-10px;background:#fdfbf4;color:#8a8576;font-size:10px;padding:0 6px;font-family:-apple-system,sans-serif}
#dec-body .ln{cursor:pointer;border-radius:3px;min-height:1.5em}
#dec-body .ln:hover{background:rgba(0,0,0,.04)}
#dec-body .ln.sel{background:#fff0a8;box-shadow:inset 3px 0 0 #e0a800}
#dec-body .ln.hit{background:#d6e8ff}
#dec-body .ln.sec{color:#7a4e00;font-weight:700}
#dec-pop .rc{color:var(--blue)}
#dec-pop{position:absolute;left:0;right:0;bottom:0;max-height:42vh;overflow:auto;background:var(--card);border-top:2px solid var(--gold);padding:12px 16px 20px;display:none;box-shadow:0 -6px 24px rgba(0,0,0,.35);font-size:15px;line-height:1.6}
#dec-pop .w{font-size:14px;color:var(--dim);margin-bottom:6px}
#dec-pop .l{font-size:16px}
#dec-pop .rf{float:right;margin-right:10px;padding:4px 10px;border:1px solid var(--line);border-radius:14px;font-size:13px;cursor:pointer;color:var(--blue);user-select:none}
#dec-pop .rf.busy{color:var(--amber)}

<script>
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const lsGet = k => { try { return localStorage.getItem('fa.' + k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem('fa.' + k, v); } catch (e) {} };
const MIN = 6e4, NM = 1.852;
const z2 = n => String(n).padStart(2, '0');
const hmZ = t => { if (t == null) return '--'; const d = new Date(t); return z2(d.getUTCHours()) + z2(d.getUTCMinutes()) + 'Z'; };
const dZ = t => { if (t == null) return '--'; const d = new Date(t); return z2(d.getUTCDate()) + ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'][d.getUTCMonth()] + ' ' + z2(d.getUTCHours()) + z2(d.getUTCMinutes()) + 'Z'; };
const dur = m => Math.floor(m / 60) + 'h' + z2(Math.round(m % 60));

/* ---------------- 语言：中文 / English / 中英 ---------------- */
let LANG = lsGet('lang') || 'both';
const tt = (zh, en) => LANG === 'zh' ? zh : LANG === 'en' ? en : zh + ' · ' + en;          // 纯文字
const th = (zh, en) => LANG === 'zh' ? zh : LANG === 'en' ? en : zh + '<span class="en">' + en + '</span>';   // HTML
const thb = (zh, en) => LANG === 'zh' ? zh : LANG === 'en' ? en : zh + '<div class="en">' + en + '</div>';
function applyLang() {
  document.querySelectorAll('[data-i]').forEach(el => { const [z, e] = el.dataset.i.split('|'); el.innerHTML = el.tagName === 'OPTION' ? tt(z, e) : th(z, e); });
  $('b-lang').textContent = { zh: '中', en: 'EN', both: '中/EN' }[LANG];
  document.documentElement.lang = LANG === 'en' ? 'en' : 'zh-CN';
}
function setLang(l) { LANG = l; lsSet('lang', l); applyLang(); if (typeof drawRoute === 'function') { drawLegend(); lastList = 0; tick(); } }
$('b-lang').onclick = () => setLang({ zh: 'en', en: 'both', both: 'zh' }[LANG]);
applyLang();

// 大圆距离（海里）、方位
function distNm(a, b) {
  const r = Math.PI / 180, h = Math.sin((b[0] - a[0]) * r / 2) ** 2 + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin((b[1] - a[1]) * r / 2) ** 2;
  return 2 * 3440.065 * Math.asin(Math.min(1, Math.sqrt(h)));
}
function brg(a, b) {
  const r = Math.PI / 180, y = Math.sin((b[1] - a[1]) * r) * Math.cos(b[0] * r);
  const x = Math.cos(a[0] * r) * Math.sin(b[0] * r) - Math.sin(a[0] * r) * Math.cos(b[0] * r) * Math.cos((b[1] - a[1]) * r);
  return (Math.atan2(y, x) / r + 360) % 360;
}

/* ---------------- 状态 ---------------- */
const S = { fix: null, ofp: null, atd: null, AP: {}, EK: null, tab: 'now', follow: true, pts: [], drag: null, dragging: false, dragAt: 0, userScroll: 0, showRings: lsGet('rings') !== '0', tl: null };
const toast = (h, ms) => { const e = $('toast'); e.innerHTML = h; e.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => e.style.display = 'none', ms || 3500); };
try { S.ofp = JSON.parse(lsGet('ofp') || 'null'); } catch (e) {}
// 解析规则更新过：用保存的 OFP 原文重新读一遍（移交点、油量等新内容才会出现）
if (S.ofp && S.ofp.pv !== OFP.PV) {
  const raw = lsGet('ofptext');
  if (raw) { try { const r = OFP.parse(raw); if (r.ok) { S.ofp = r; lsSet('ofp', JSON.stringify(r)); } } catch (e) {} }
  else S.ofpOld = true;
}
S.atd = +lsGet('atd') || null;
try { S.fix = JSON.parse(lsGet('fix') || 'null'); } catch (e) {}

/* ---------------- 地图（离线：内置世界地图） ---------------- */
/* ---------------- 白天 / 夜间 ---------------- */
let THEME = lsGet('theme') || 'dark', L_land = null;
const moraLv = m => (m || 0) >= 150 ? 'xh' : (m || 0) >= 100 ? 'hi' : 'safe';     // MORA（百英尺）：≥15000 红、≥10000 琥珀
const MAPC = () => THEME === 'light'
  ? { land: { color: '#b9b3a6', fillColor: '#f5f2ea' }, safe: '#2b8fd8', hi: '#e08a00', xh: '#d93a30', route: '#5a6f96', done: '#c27f00', r2: '#5d708f', wp: '#46597a', fir: '#b01fd6' }
  : { land: { color: '#33425f', fillColor: '#18233a' }, safe: '#7cc8ff', hi: '#ffab2e', xh: '#ff5a4f', route: '#6f87b3', done: '#e2b964', r2: '#9fb0cc', wp: '#9fb0cc', fir: '#e26bff' };
function applyTheme() {
  document.documentElement.dataset.theme = THEME;
  $('b-theme').textContent = THEME === 'light' ? '☀' : '☾';
  $('b-theme').title = tt(THEME === 'light' ? '白天模式（点一下换夜间）' : '夜间模式（点一下换白天）', THEME === 'light' ? 'Day mode (tap for night)' : 'Night mode (tap for day)');
  const m = document.querySelector('meta[name=theme-color]'); if (m) m.content = THEME === 'light' ? '#f7f9fc' : '#0b1220';
  if (L_land) L_land.setStyle(MAPC().land);
}
const map = L.map('map', { zoomControl: false, attributionControl: false, minZoom: 2, maxZoom: 10, zoomSnap: .5, worldCopyJump: true }).setView([24, 80], 4);
fetch('data/countries.json').then(r => r.json()).then(topo => {
  L_land = L.geoJSON(topojson.feature(topo, topo.objects.countries), { style: Object.assign({ weight: .8, fillOpacity: 1 }, MAPC().land), interactive: false }).addTo(map);
  drawRoute();
}).catch(() => {});
let L_route, L_done, L_plane, L_wps = [], L_aps = [], L_apm = {};
const R1 = 410, R2 = 820;                                                 // 1 小时 / 2 小时圈（海里）
const ringOpt = (c, w) => ({ radius: 1, color: c, weight: w, dashArray: '7 7', fill: false, interactive: false });
const L_r1 = L.circle([0, 0], Object.assign(ringOpt('#e2b964', 1.6), { radius: R1 * 1852 }));
const L_r2 = L.circle([0, 0], Object.assign(ringOpt('#9fb0cc', 1.2), { radius: R2 * 1852 }));
$('b-theme').onclick = () => { THEME = THEME === 'light' ? 'dark' : 'light'; lsSet('theme', THEME); applyTheme(); L_r2.setStyle({ color: MAPC().r2 }); if (S.ofp) drawRoute(); lastList = 0; tick(); };
applyTheme(); L_r2.setStyle({ color: MAPC().r2 });
const L_r1t = L.marker([0, 0], { icon: L.divIcon({ className: '', html: '<span class="rlab">1h · 410 nm</span>', iconSize: [90, 14], iconAnchor: [45, 16] }), interactive: false });

/* ---------------- 航路点：坐标 + 计划时间（缺坐标的按距离插值） ---------------- */
function buildPts() {
  const o = S.ofp; if (!o) return [];
  const raw = o.navlog.map(w => ({ id: w.id, t: w.t, dist: w.dist, mora: w.mora, pos: w.id === o.flight.dep ? apPos(o.flight.dep) : w.id === o.flight.arr ? apPos(o.flight.arr) : (o.fixes[w.id] || null) }));
  if (raw.length && !raw[0].pos) raw[0].pos = apPos(o.flight.dep);
  if (raw.length && !raw[raw.length - 1].pos) raw[raw.length - 1].pos = apPos(o.flight.arr);
  for (let i = 0; i < raw.length; i++) {
    if (raw[i].pos) continue;
    let a = i - 1; while (a >= 0 && !raw[a].pos) a--;
    let b = i + 1; while (b < raw.length && !raw[b].pos) b++;
    if (a < 0 || b >= raw.length) continue;
    const f = (raw[i].dist - raw[a].dist) / Math.max(1, raw[b].dist - raw[a].dist);
    raw[i].pos = [raw[a].pos[0] + (raw[b].pos[0] - raw[a].pos[0]) * f, raw[a].pos[1] + (raw[b].pos[1] - raw[a].pos[1]) * f];
    raw[i].interp = true;
  }
  return raw.filter(p => p.pos);
}
// 起飞后 m 分钟的位置（按导航日志的计划时间插值）
function posAt(m) {
  const P = S.pts; if (!P.length) return null;
  if (m <= 0) return { pos: P[0].pos, i: 0, hdg: brg(P[0].pos, P[1].pos), gs: 0, dist: 0 };
  for (let i = 1; i < P.length; i++) {
    if (m <= P[i].t) {
      const a = P[i - 1], b = P[i], f = (m - a.t) / Math.max(1, b.t - a.t);
      const gs = (b.dist - a.dist) / Math.max(1, b.t - a.t) * 60;
      return { pos: [a.pos[0] + (b.pos[0] - a.pos[0]) * f, a.pos[1] + (b.pos[1] - a.pos[1]) * f], i, hdg: brg(a.pos, b.pos), gs, dist: a.dist + (b.dist - a.dist) * f, next: b };
    }
  }
  const e = P[P.length - 1];
  return { pos: e.pos, i: P.length - 1, hdg: 0, gs: 0, dist: e.dist, landed: true };
}

function drawRoute() {
  [L_route, L_done, L_plane].concat(L_wps, L_aps).forEach(l => l && map.removeLayer(l));
  L_wps.forEach(l => map.removeLayer(l));
  L_wps = []; L_aps = []; L_apm = {}; L_hl.clearLayers();
  drawLegend();
  if (!S.ofp) return;
  const o = S.ofp;
  S.pts = buildPts();
  // 经度连续（跨 180° 不断开）
  const line = []; let prev = null;
  S.pts.forEach(p => { let lo = p.pos[1]; if (prev != null) { while (lo - prev > 180) lo -= 360; while (lo - prev < -180) lo += 360; } prev = lo; line.push([p.pos[0], lo]); });

      .bindTooltip((fx ? p.id + ' ▸' + fx.code : p.id) + (p.mora != null ? ' <span class="mora ' + moraLv(p.mora) + '">' + p.mora + '</span>' : ''), { permanent: true, direction: 'right', className: fx ? 'wp firwp' : 'wp', offset: [fx ? 6 : 4, 0] }).addTo(map);

/* ---------------- 某机场在时间 t 的天气 / 跑道 / NOTAM ---------------- */
function assess(c, t) {
  const ref = S.ofp.flight.dateUTC + 12 * 3600e3;

    tc.items.forEach(it => { if (!it.str) return; const y = Math.round(it.transform[5] / 2) * 2; (rows[y] = rows[y] || []).push(it); if (it.str.trim().length > 2) { cw += it.width / it.str.length; cn++; } });
    cw = cn ? cw / cn : 6;
    const ys = Object.keys(rows).map(Number).sort((a, b) => b - a);
    const plines = [];
    ys.forEach(y => {
      let line = '';
      rows[y].sort((a, b) => a.transform[4] - b.transform[4]).forEach(it => {
        const col = Math.round(it.transform[4] / cw);
        if (col > line.length) line += ' '.repeat(col - line.length); else if (line && !/\s$/.test(line)) line += ' ';
        line += it.str;

      plines.push(line);
    });
    // 去掉页面左边距（和电脑上复制出来的文字对齐）
    const ind = Math.min(...plines.filter(l => l.trim()).map(l => l.match(/^ */)[0].length));
    plines.forEach(l => pages.push(isFinite(ind) ? l.slice(ind) : l));
    $('msg').textContent = tt('正在读取 PDF…', 'Reading PDF…') + ' ' + n + '/' + doc.numPages;
  }
  return pages.join('\n');
}

/* ---------------- 自动发给家里的时钟 ---------------- */
const APPV = 'v20';

function planPayload() {

  const last = P[P.length - 1];
  return JSON.stringify({ digits: f.digits, date: f.date, depIata: f.depIata, arrIata: f.arrIata, reg: f.reg, trip: o.times.trip, taxi: o.times.taxi, gnd: last ? last.dist : o.times.groundDist, pts, atd: S.atd || null });

  $('syncst').innerHTML = !key ? '<span class="t-amber">' + th('还没填口令，暂时不会发送', 'No key yet — nothing will be sent') + '</span>'
    : pend ? '⏳ ' + th('等有网络时自动发送', 'Will send when online') : ok ? '✅ ' + th('已发给时钟', 'Sent to clock') + ' ' + hmZ(ok) : '';

let syncing = false;
async function syncClock(quiet) {

async function flushClock(quiet) {

  syncing = true;
  try {
    const r = await fetch(clockUrl() + (clockUrl().includes('?') ? '&' : '?') + 'k=' + encodeURIComponent(key), { method: 'POST', body });
    const t = await r.text();
    if (/^✅/.test(t)) { if (lsGet('pending') === body) { try { localStorage.removeItem('fa.pending'); } catch (e) {} } lsSet('syncok', Date.now()); if (!quiet) toast('🏠 ' + th('已发给家里的时钟', 'Sent to home clock') + '<br><small>' + esc(t) + '</small>', 5000); }

// 航路点列表：下一个航路点在最上面（大），接着是后面的；飞过的像算盘珠一样落到最下面
let wpNextKey = null;

  const SECN = { head: ['飞行计划首页（油量、时间、重量）', 'OFP front page (fuel, times, weights)'], altn: ['目的地备降场表', 'Destination alternates'], disp: ['签派提示', 'Dispatch notes'], nav: ['导航日志（每个航路点）', 'Navigation log'], navalt: ['去备降场的导航日志', 'Navlog to alternate'], winds: ['高空风温表', 'Winds aloft'], wx: ['天气（METAR / TAF）', 'Weather'], notam: ['航行通告', 'NOTAMs'], crew: ['机组信息', 'Crew info'], conotam: ['公司通告 / 机组须知', 'Company NOTAMs / crew info'], etops: ['ETOPS 信息', 'ETOPS information'] }[sec] || ['', ''];
  $('dec-pop').innerHTML = '<span class="x" onclick="document.getElementById(\'dec-pop\').style.display=\'none\'">✕</span><span class="rf" id="dec-rf" onclick="decRefresh()">⟳ ' + tt('刷新', 'Refresh') + '</span><div class="w">' + tt(SECN[0], SECN[1]) + (word ? ' · <b style="color:var(--text)">' + esc(word) + '</b>' : '') + '</div>' +
    (W1 ? '<div style="margin-bottom:8px;color:var(--dim);font-size:13.5px">' + tt('你点的', 'You tapped') + ' · ' + pick(W1) + '</div>' : '') + (L1 ? '<div class="l">' + pick(L1) + '</div>' : (W1 ? '' : '<div style="color:var(--dim)">' + tt('这一行没有特别的意思（标题、空格或者格式）', 'Nothing special on this line (heading / layout)') + '</div>')) + omHtml(omFor(word, i, +ln.dataset.pos || 0)) + aiHtml(word, sec);
  $('dec-pop').style.display = 'block';
}
// ⟳ 刷新：有网 → 马上把这一段翻成中文 + 联网 AI 解读，存在 iPad 上；没网 → 保留原来的离线内容
async function decRefresh() {
  if (!DLAST) return; const b = $('dec-rf'); if (!b || b.classList.contains('busy')) return;
  b.classList.add('busy'); b.textContent = '⟳ ' + tt('联网中…', 'Connecting…');
  const done = () => { const x = $('dec-rf'); if (x) { x.classList.remove('busy'); x.textContent = '⟳ ' + tt('刷新', 'Refresh'); } };
  if (!(await online())) { done(); toast('📵 ' + tt('当前无网络，保留离线内容', 'No network — keeping the offline version')); return; }
  if (!needKey()) { done(); return; }
  const i = DLAST.i, post = body => fetch(clockUrl() + '?k=' + encodeURIComponent(lsGet('key')), { method: 'POST', body: JSON.stringify(body) }).then(r => r.text()).then(t => JSON.parse(t));
  let ok = false;
  try {
    // 1. 整段翻译（通告 / 公司通告 / 签派提示 / 段落）
    const id = DNOT && DNOT[i]; let n = null;
    if (id && S.ofp) Object.values(S.ofp.notams).some(a => (n = a.find(x => x.id === id)));
    const pa = !n && /^(disp|conotam|crew|etops|notam)$/.test(DSEC[i]) ? paraOf(i) : null;
    if (n || pa) { b.textContent = '⟳ ' + tt('翻译中…', 'Translating…');
      const j = await post({ action: 'translate', texts: [NX.en(n ? n.text : pa.text)], to: 'zh-CN' });
      if (j.ok && j.out[0]) { if (n) { TR[n.id] = j.out[0]; lsSet('tr', JSON.stringify(TR)); } else { TRP[hash(pa.text)] = j.out[0]; lsSet('trp', JSON.stringify(TRP)); } ok = true; } }
    // 2. 联网 AI 解读（这一整块）
    const d = JSON.parse($('dec-pop').dataset.ai || '{}');
    if (d.k) { b.textContent = '⟳ ' + tt('AI 解读中…（10–30 秒）', 'AI explaining… (10–30 s)');
      const SECN = { head: 'OFP front page (fuel/times/weights)', altn: 'destination alternates', disp: 'dispatch briefing', nav: 'navigation log', navalt: 'navlog to alternate', winds: 'winds/temperatures aloft table', wx: 'weather METAR/TAF', notam: 'NOTAM', crew: 'crew info', conotam: 'company NOTAM', etops: 'ETOPS info' };
      try { const j = await post({ action: 'explain', text: d.text, word: d.word || '', section: SECN[d.sec] || d.sec, lang: aiLang() });
        if (j.ok && j.out) { AI[d.k] = { out: j.out, t: Date.now() }; lsSet('ai', JSON.stringify(AI)); ok = true; } } catch (e) {} }
  } catch (e) {}
  done();
  if (DLAST && DLAST.i === i) decShow(i, DLAST.word);
  toast(ok ? '✅ ' + tt('已联网更新，离线也能看', 'Updated — saved for offline') : '⚠️ ' + tt('没取到新内容，保留原来的', 'Nothing new — kept the offline version'), 3000);
}
$('b-dec').onclick = e => { e.preventDefault(); openDec(); };
$('dec-x').onclick = () => $('dec').classList.remove('open');
$('dec-q').onkeydown = e => { if (e.key !== 'Enter') return; const q = $('dec-q').value.trim().toUpperCase(); if (!q || !DL) return;
  const from = (+($('dec-body').dataset.hit || -1)) + 1; let k = DL.findIndex((l, i) => i >= from && l.toUpperCase().indexOf(q) >= 0); if (k < 0) k = DL.findIndex(l => l.toUpperCase().indexOf(q) >= 0); if (k < 0) { toast(tt('找不到', 'Not found')); return; }
  $('dec-body').dataset.hit = k; document.querySelectorAll('#dec-body .ln.hit').forEach(x => x.classList.remove('hit')); const el = $('dec-body').querySelector('[data-i="' + k + '"]'); el.classList.add('hit'); el.scrollIntoView({ block: 'center' }); };

/* ---------------- Today Brief ---------------- */
let briefFullMode = false;
const showBrief = () => { $('brief-pg').innerHTML = briefFullMode ? briefFull() : briefOne(); $('brief-pg').classList.toggle('one', !briefFullMode); };
$('b-brief').onclick = e => { e.preventDefault(); if (!S.ofp) { openLoad(); return; } showBrief(); $('brief').classList.add('open'); $('brief').scrollTop = 0; };
$('b-full').onclick = () => { briefFullMode = !briefFullMode; showBrief(); };
$('b-bclose').onclick = () => $('brief').classList.remove('open');
$('b-print').onclick = () => window.print();

/* ---------------- 开始 ---------------- */
Promise.all([apReady, ekReady]).then(() => {
  if (S.ofp) {
    $('t-fl').textContent = S.ofp.flight.no + ' · ' + S.ofp.flight.date;
    delete $('t-rt').dataset.i; $('t-rt').textContent = S.ofp.flight.dep + ' → ' + S.ofp.flight.arr + ' · ' + S.ofp.flight.reg + ' · STD ' + hmZ(S.ofp.times.std) + ' · TRIP ' + dur(S.ofp.times.trip);
    if (S.atd) $('atd').value = hmZ(S.atd).slice(0, 4);
    drawRoute();
  } else openLoad();
  applyUI(); tick(); setInterval(tick, 5000); fixBar();
  flushClock(true); translateNotams(true); translateOM(true); setTimeout(translateParas, 4000);
  if (S.ofpOld) toast('⚠️ ' + th('这份 OFP 是用旧版本读入的，请重新载入一次 OFP，才会显示移交点、油量等新内容。', 'This OFP was read by an older version — please load it again to see FIR boundaries, fuel, etc.'), 20000);
});
// 测试用：?sim=分钟 把时间设到起飞后多少分钟
const SIM = new URLSearchParams(location.search).get('sim');
if (SIM != null) setTimeout(() => { if (S.ofp) { const at = (S.ofp.times.std || 0) + 20 * MIN; S.sim = at + (+SIM) * MIN - Date.now(); setATD(at); } }, 800);
</script>
