<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b1220">
<title>Flight Assist</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="stylesheet" href="../vendor/leaflet/leaflet.css">
<style>
:root{--bg:#0b1220;--panel:#111a2b;--line:#22304a;--text:#e9eef7;--dim:#8d9ab3;--gold:#e2b964;--green:#3fcf7f;--amber:#f3b13c;--red:#ff5d55;--blue:#6fb4ff;
  --top:var(--top);--btn:var(--btn);--card:var(--card);--input:#0b1220;--hud:var(--hud);--sum:var(--sum);--on:var(--on);--wp:#9fb0cc;--sh:0 0 3px #000;--sea:#0b1220;--fir:#e26bff}
:root[data-theme=light]{--bg:#e9eef5;--panel:#ffffff;--line:#c9d3e2;--text:#0f1b2d;--dim:#56657e;--gold:#a8740d;--green:#16924a;--amber:#b97700;--red:#d0302a;--blue:#1f6fd1;
  --top:#f7f9fc;--btn:#eef2f8;--card:#f8fafd;--input:#ffffff;--hud:rgba(255,255,255,.93);--sum:#e6eefb;--on:#d4e2fb;--wp:#46597a;--sh:0 0 3px #fff,0 0 2px #fff;--sea:#cfe0f0;--fir:#b01fd6}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif;overflow:hidden;-webkit-text-size-adjust:100%}
.num{font-variant-numeric:tabular-nums}
button{font-family:inherit}
#app{position:fixed;inset:0;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(330px,1fr);grid-template-rows:auto minmax(0,1fr)}
@media (orientation:portrait){#app{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr) minmax(0,1fr)}}
/* 顶栏 */
#top{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:max(8px,env(safe-area-inset-top)) 14px 8px;background:var(--top);border-bottom:1px solid var(--line);flex-wrap:nowrap}
#top>*{flex-shrink:0}#top .rt{flex-shrink:1}#top .fl{white-space:nowrap}
#top .fl{font-size:20px;font-weight:700;color:var(--gold)}
#top .rt{font-size:14px;color:var(--dim);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:0 1 auto}
#top .btn .en{display:none}
#top .sp{flex:1}
#utc{font-size:22px;font-weight:600}
#utc small{font-size:12px;color:var(--dim);margin-left:4px}
.btn{border:1px solid var(--line);background:var(--btn);color:var(--text);border-radius:10px;padding:8px 12px;font-size:14px;cursor:pointer}
.btn.pri{background:var(--gold);border-color:var(--gold);color:#1a1204;font-weight:700}
.btn.sm{padding:5px 9px;font-size:12px}
.pill{display:inline-block;border-radius:6px;padding:1px 6px;font-size:11px;font-weight:700;letter-spacing:.03em;vertical-align:1px}
/* 地图 */
#mapwrap{position:relative;min-height:0}
#map{position:absolute;inset:0;background:var(--sea)}
.leaflet-container{background:var(--sea);font-family:inherit}
.wp{color:var(--wp);font-size:10px;font-weight:600;background:none;border:none;box-shadow:none;padding:0;text-shadow:var(--sh)}
.wp:before{display:none}
#map.far .wp{display:none}
.wp.firwp{color:var(--fir);font-size:11.5px;font-weight:900}
#atd.dirty{border-color:var(--amber);box-shadow:0 0 0 2px rgba(243,177,60,.35)}
#sheet .in{background:var(--card)}
.apl{background:var(--hud);border:1px solid var(--line);color:var(--text);font-size:11px;font-weight:700;padding:1px 4px;border-radius:4px;box-shadow:none}
.apl:before{display:none}
#hud{position:absolute;left:10px;right:10px;bottom:10px;display:flex;gap:8px;flex-wrap:wrap;z-index:500;pointer-events:none}
#hud .c{background:var(--hud);border:1px solid var(--line);border-radius:10px;padding:6px 10px;pointer-events:auto}
#hud .k{font-size:10px;color:var(--dim);letter-spacing:.06em}
#hud .v{font-size:17px;font-weight:600}
#recenter{position:absolute;right:10px;top:10px;z-index:500;display:none}
/* 右侧面板 */
#side{min-height:0;display:flex;flex-direction:column;border-left:1px solid var(--line);background:var(--panel)}
@media (orientation:portrait){#side{border-left:none;border-top:1px solid var(--line)}}
#tabs{display:flex;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line)}
#tabs .btn.on{background:var(--on);border-color:#3a5584}
#list{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:6px 8px 20px}
.ap{border:1px solid var(--line);border-radius:12px;padding:9px 11px;margin:6px 0;background:var(--card);cursor:pointer}
.ap .h{display:flex;align-items:baseline;gap:8px}
.ap .id{font-size:17px;font-weight:700}
.ap .nm{font-size:12px;color:var(--dim);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ap .d{font-size:13px;color:var(--text);white-space:nowrap}
.ap .w{font-size:13px;margin-top:4px;line-height:1.45}
.ap .n{font-size:12px;margin-top:3px;line-height:1.45}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}
.g{background:var(--green)}.a{background:var(--amber)}.r{background:var(--red)}.x{background:#5b6680}
.t-red{color:var(--red)}.t-amber{color:var(--amber)}.t-info{color:var(--dim)}
.tag{border:1px solid #3a4b6c;color:#bcd0f0;border-radius:5px;font-size:10.5px;padding:0 5px;margin-left:4px;white-space:nowrap}
.cat{display:inline-block;min-width:26px;text-align:center;border-radius:6px;padding:1px 5px;font-size:12px;font-weight:800;color:#0b1220;vertical-align:2px}
.cat.cD{background:#14a04f;color:#fff}.cat.cA1{background:#8ff0a8}.cat.cA2{background:#f7dc2a}.cat.cCA{background:#ff8c1a}.cat.cEA{background:#ff3b30;color:#fff}.cat.cX{background:#6d0000;color:#fff}.cat.cN{background:#4a5570;color:#c9d3e6}
#legend{position:absolute;left:10px;top:10px;z-index:500;background:var(--hud);border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:11px;line-height:1.7;color:var(--dim)}
#legend .cat{font-size:10px;min-width:22px;margin-right:3px}
#map.far5 .apl.x5{display:none}
.hint{font-size:12px;margin-top:3px;line-height:1.45}
/* 详情 */
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:2000}
#sheet.open{display:block}
#sheet .in{position:absolute;right:0;top:0;bottom:0;width:min(560px,100%);background:var(--card);border-left:1px solid var(--line);overflow:auto;padding:16px 16px 40px;-webkit-overflow-scrolling:touch}
#sheet h2{margin:0 0 2px;font-size:22px}
#sheet h3{margin:16px 0 6px;font-size:13px;color:var(--dim);letter-spacing:.08em;font-weight:600}
#sheet .raw{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--wp);white-space:pre-wrap;background:var(--input);border-radius:8px;padding:8px;margin-top:4px}
#sheet table{border-collapse:collapse;width:100%;font-size:13px}
#sheet td,#sheet th{border-bottom:1px solid var(--line);padding:5px 4px;text-align:left}
details summary{cursor:pointer;color:var(--blue);font-size:12px;margin-top:3px}
/* 载入 */
#load{position:fixed;inset:0;z-index:3000;background:var(--bg);display:none;align-items:center;justify-content:center;padding:20px}
#load.open{display:flex}
#load .in{width:min(640px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}
#load h1{margin:0 0 6px;font-size:22px}
#load p{color:var(--dim);font-size:14px;line-height:1.55;margin:6px 0}
#load textarea{width:100%;height:150px;background:var(--input);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
#load input[type=text]{background:var(--input);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:15px;width:100%}
#load .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;align-items:center}
#msg{font-size:13px;color:var(--amber);margin-top:8px;white-space:pre-wrap}
#atdbox{display:flex;align-items:center;gap:6px}
#atd{width:86px;background:var(--input);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:16px;text-align:center}
.disc{font-size:10.5px;color:#6f7d98;padding:6px 10px;border-top:1px solid var(--line)}
.en{color:#8d9ab3;font-size:.86em;font-weight:400;margin-left:4px}
div.en,.wl .en{display:block;margin-left:0}
#tabs .btn .en{display:block;margin-left:0;font-size:10px}
.sum{border:1px solid #3a5584;background:var(--sum);border-radius:12px;padding:9px 11px;margin:6px 0 4px}
.sum .t{font-size:14px;font-weight:700}
.sum .s{font-size:12px;color:var(--dim);margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:4px 7px;font-size:13px;font-weight:700;cursor:pointer}
.chip small{font-weight:400;color:var(--dim);font-size:11px}
.ap.cur{box-shadow:0 0 0 1.5px #ffffffaa inset}
.rlab{color:#e2b964;font-size:11px;font-weight:700;white-space:nowrap;text-shadow:var(--sh)}
.rlab.r2{color:#9fb0cc}
#b-upd.new{border-color:var(--green);color:var(--green)}
#updbar{position:absolute;left:50%;transform:translateX(-50%);bottom:84px;z-index:650;background:var(--green);color:#06210f;font-weight:800;border-radius:12px;padding:9px 16px;font-size:14px;cursor:pointer;box-shadow:0 2px 12px rgba(0,0,0,.4);white-space:nowrap}
#syncst{font-size:13px;margin-top:6px}
#b-rings{position:absolute;right:10px;top:48px;z-index:500}
#b-rings.off{opacity:.55}
#prev{position:absolute;left:50%;transform:translateX(-50%);top:10px;z-index:600;display:none;background:var(--hud);border:1px solid #4d6fae;border-radius:12px;padding:6px 10px;font-size:13px;white-space:nowrap}
#prev .btn{margin-left:6px}
.firm{display:flex;align-items:center;gap:5px;white-space:nowrap}
.firm i{display:flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:#d63bff;border:2.5px solid #fff;box-shadow:0 0 0 3px rgba(214,59,255,.35),0 0 10px #d63bff;font-style:normal;font-size:13px;line-height:1}
.firm span{background:#d63bff;color:#fff;font-size:11px;font-weight:800;border-radius:6px;padding:2px 6px;box-shadow:0 1px 4px #000}
.firm span small{font-weight:600;opacity:.85}
#hud .c.fir{border-color:#d63bff}
#hud .c.fir.soon{background:#7a1f99;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{background:#d63bff}}
.apl.hot{font-size:12px;border:none;box-shadow:0 1px 4px #000}
.dpm{color:#ff5d55;font-weight:900;font-size:13px;text-shadow:var(--sh)}
.tr{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line);padding:6px 4px;cursor:pointer;font-size:13px}
.tr .tm{font-variant-numeric:tabular-nums;color:var(--dim);width:46px;flex:none}
.tr .ic{font-weight:800;font-size:14px;width:44px;flex:none}
.tr .nm2{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--dim);font-size:12px}
.tr .xd{font-variant-numeric:tabular-nums;font-size:12px;color:var(--dim);white-space:nowrap}
.tr.past{opacity:.4}
.tr.in1{background:var(--sum)}
.tr .hn{font-size:11px}
.nowbar{background:var(--gold);color:#1a1204;font-weight:800;font-size:12px;border-radius:6px;padding:3px 8px;margin:4px 0}
.firrow{font-size:11.5px;color:#f2b8ff;padding:3px 4px;border-bottom:1px dashed #5a3a6a}
.disc a{color:var(--gold);font-weight:700;text-decoration:none;font-size:13px;float:right;margin-left:8px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:4000;background:var(--btn);border:1px solid #3a5584;border-radius:10px;padding:8px 14px;font-size:14px;display:none}
/* Today Brief */
#brief{position:fixed;inset:0;z-index:3500;background:#5b6474;display:none;overflow:auto;-webkit-overflow-scrolling:touch}
#brief.open{display:block}
#brief .bar{position:sticky;top:0;display:flex;gap:8px;justify-content:flex-end;padding:10px;background:#0e1626;border-bottom:1px solid var(--line)}
#brief .pg{background:#fff;color:#111;max-width:820px;margin:16px auto 40px;padding:28px 34px;font-size:12.5px;line-height:1.5;box-shadow:0 4px 30px rgba(0,0,0,.4)}
#brief h1{font-size:20px;margin:0 0 2px}#brief h2{font-size:14px;margin:16px 0 6px;border-bottom:2px solid #111;padding-bottom:2px}
#brief table{border-collapse:collapse;width:100%;margin:4px 0}#brief td,#brief th{border:1px solid #bbb;padding:3px 6px;text-align:left;vertical-align:top}
#brief th{background:#eef1f6}#brief .en{color:#555}#brief .kr{color:#c0221b;font-weight:600}#brief .ka{color:#a86400;font-weight:600}#brief .kg{color:#13843f}
#brief .say{background:#f6f3e8;border-left:4px solid #c9a34a;padding:8px 12px;margin:8px 0}
#brief .say p{margin:4px 0}
#brief .cat{color:#fff}#brief .cat.cA1,#brief .cat.cA2{color:#111}
#brief .num{font-variant-numeric:tabular-nums}
#brief .small{font-size:11px;color:#555}
#brief .pg.one{font-size:11px;line-height:1.42;padding:22px 26px}
#brief .one h1{font-size:17px}#brief .one h2{font-size:12px;margin:8px 0 3px;border-bottom-width:1.5px}
#brief .one .hd{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;margin:4px 0 6px}
#brief .one .hd b{font-size:13px}
#brief .one .cols{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
#brief .one ul{margin:2px 0;padding-left:16px}#brief .one li{margin:1px 0}
#brief .one .fuel td,#brief .one .fuel th{padding:2px 5px}
#brief .one .key{background:#fff4d6}
#brief .one .flag{color:#c0221b;font-weight:700}
@media print{
  @page{size:A4;margin:12mm}
  html,body{overflow:visible!important;height:auto!important;background:#fff!important}
  #app,#sheet,#load,#toast,#brief .bar{display:none!important}
  #brief{position:static!important;display:block!important;background:#fff!important;overflow:visible!important}
  #brief .pg{box-shadow:none;margin:0;padding:0;max-width:none}
  #brief h2{break-after:avoid}#brief tr{break-inside:avoid}
  #brief .pg.one{padding:0;font-size:10.5px}
  .cat{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <span class="fl" id="t-fl">Flight Assist</span>
    <span class="rt" id="t-rt" data-i="载入 OFP 开始|Load an OFP to start"></span>
    <span class="sp"></span>
    <span id="atdbox"><span style="font-size:12px;color:var(--dim)">ATD</span><input id="atd" inputmode="numeric" maxlength="4" placeholder="HHMM"><span style="font-size:12px;color:var(--dim)">Z</span><button class="btn sm pri" id="b-atdok" data-i="确定|OK"></button></span>
    <span id="utc" class="num">--:--<small>UTC</small></span>
    <button class="btn sm" id="b-upd">⟳</button>
    <button class="btn sm" id="b-theme" style="min-width:38px"></button>
    <button class="btn sm" id="b-lang" style="min-width:52px"></button>
    <button class="btn sm" id="b-load">OFP</button>
  </div>
  <div id="mapwrap">
    <div id="map"></div>
    <button class="btn sm" id="recenter" data-i="◎ 回到飞机|◎ Follow aircraft"></button>
    <div id="legend"></div>
    <button class="btn sm" id="b-rings">◯ 1h / 2h</button>
    <div id="prev"></div>
    <div id="updbar" style="display:none"></div>
    <div id="hud"></div>
  </div>
  <div id="side">
    <div id="tabs">
      <button class="btn sm on" data-tab="now" data-i="当前备降|Now"></button>
      <button class="btn sm" data-tab="route" data-i="航路时间线|Enroute"></button>
      <button class="btn sm" data-tab="near" data-i="最近|Nearest"></button>
      <button class="btn sm" data-tab="plan" data-i="目的地/备降|Dest/Altn"></button>
      <button class="btn sm" data-tab="all" data-i="OFP 天气|OFP WX"></button>
    </div>
    <div id="list"></div>
    <div class="disc"><a href="#" id="b-brief">📋 Today Brief</a><span data-i="仅供辅助了解情况，不作为运行依据 · 以公司批准的 EFB / 签派 / ATC 为准 · 天气和 NOTAM 来自 OFP 包，时间均为 UTC|Awareness aid only, not for operational use · Company-approved EFB / dispatch / ATC prevail · WX and NOTAM from the OFP package, all times UTC"></span></div>
  </div>
</div>

<div id="sheet"><div class="in" id="sheet-in"></div></div>
<div id="brief"><div class="bar"><button class="btn sm" id="b-full" data-i="一页版 / 详细版|1-page / full"></button><button class="btn pri" id="b-print" data-i="🖨 打印 / 存 PDF|🖨 Print / Save PDF"></button><button class="btn" id="b-bclose" data-i="关闭|Close"></button></div><div class="pg" id="brief-pg"></div></div>
<div id="toast"></div>

<div id="load">
  <div class="in">
    <h1 data-i="载入 OFP|Load OFP"></h1>
    <p data-i="选择 OFP 的 PDF 文件（推荐），或者把 OFP 文字全部复制粘贴到下面。读出来的内容只保存在这台 iPad 上，飞行中不需要网络。|Choose the OFP PDF (recommended) or paste the whole OFP text below. Everything stays on this iPad; no network needed in flight."></p>
    <div class="row"><input type="file" id="f-pdf" accept="application/pdf,.pdf"></div>
    <p style="margin-top:12px" data-i="或者粘贴文字：|Or paste text:"></p>
    <textarea id="f-txt" placeholder="EK9873 11NOV ZGGG/CAN-OMDW/DWC ..."></textarea>
    <div class="row">
      <button class="btn pri" id="b-parse" data-i="读取|Read"></button>
      <button class="btn" id="b-close" data-i="关闭|Close"></button>
      <span class="sp" style="flex:1"></span>
      <button class="btn sm" id="b-clock" data-i="发给时钟|Send to clock"></button>
    </div>
    <div id="msg"></div>
    <details style="margin-top:12px"><summary data-i="设置（语言、机型、时钟、授权表）|Settings (language, type, clock, table)"></summary>
      <p data-i="语言：|Language:"></p>
      <div class="row"><select id="s-lang" style="font-size:15px;padding:6px;background:var(--input);color:var(--text);border:1px solid var(--line);border-radius:8px"><option value="zh">中文</option><option value="en">English</option><option value="both">中文 + English</option></select></div>
      <p data-i="机型（决定用公司机场授权表里哪一栏）：|Aircraft type (which column of the authorisation table):"></p>
      <div class="row"><select id="s-type" style="font-size:15px;padding:6px;background:var(--input);color:var(--text);border:1px solid var(--line);border-radius:8px"><option value="" data-i="自动（按 OFP）|Auto (from OFP)"></option></select></div>
      <p data-i="家里的时钟：读入 OFP 和确定起飞时间后会自动发送（没网时先存着，有网自动补发）。只需要填一次口令。|Home clock: the plan and your ATD are sent automatically (queued while offline). Enter the key once."></p><div id="syncst"></div>
      <input type="text" id="s-clock" placeholder="https://script.google.com/macros/s/…/exec">
      <div class="row"><input type="text" id="s-key" placeholder="口令" style="max-width:220px"></div>
      <p><span data-i="公司机场授权表（OMA 12.2.5）：从手册里整张复制，粘贴到下面，点「导入」。只保存在这台 iPad 上，不会上传。|Aerodrome Authorisation Table (OMA 12.2.5): copy the whole table from the manual, paste below, tap Import. Stored on this iPad only, never uploaded."></span><span id="ek-st"></span></p>
      <textarea id="s-ek" style="height:90px" placeholder="Aerodrome Authorisation Table (Listed ICAO)&#10;12.2.5.1 — AG-AY&#10;ICAO&#10;IATA&#10;…"></textarea>
      <div class="row"><button class="btn" id="b-ek" data-i="导入授权表|Import table"></button><button class="btn sm" id="b-ekclr" data-i="删除|Delete"></button></div>
      <div class="row"><button class="btn" id="b-save" data-i="保存设置|Save settings"></button></div>
      <p class="small" style="margin-top:14px;color:var(--dim)"><span id="verlbl"></span> · <a href="#" id="b-force" style="color:var(--amber)" data-i="网页一直不更新？点这里强制重新下载（需要网络）|Stuck on an old version? Force re-download (needs network)"></a></p>

/* ---------------- 航路点：坐标 + 计划时间（缺坐标的按距离插值） ---------------- */
function buildPts() {

  // 航路上每 5 分钟一个点（算各机场离航路多远、什么时候经过）
  S.samp = []; for (let m = 0; m <= (o.times.trip || 0); m += 5) { const q = posAt(m); if (q) S.samp.push({ t: m, pos: q.pos }); }
  // 释压改航点 DP
  (o.dp || []).forEach(d => {
    const m = /DP\s+([NS]\d{4}\.\d)\s+([EW]\d{5}\.\d)/.exec(d[0] || ''); if (!m) return;
    L_wps.push(L.marker([OFP.ll(m[1]), OFP.ll(m[2])], { icon: L.divIcon({ className: '', html: '<span class="dpm">✕ DP</span>', iconSize: [40, 14], iconAnchor: [6, 7] }), interactive: false }).addTo(map));
  });
  L_done = L.polyline([], { color: MAPC().done, weight: 3 }).addTo(map);
  const FIRWP = {}; (o.firs || []).forEach(f => { if (f.wp) FIRWP[f.wp] = f; });
  S.pts.forEach((p, k) => {
    if ((p.interp && !FIRWP[p.id]) || /^(TOC|TOD)$/.test(p.id)) return;

  L_plane.on('dragend', () => { S.dragging = false; S.dragAt = Date.now(); lastList = 0; S.userScroll = 0; tick(); });
  map.fitBounds(L_route.getBounds(), { padding: [30, 30] });
}

/* ---------------- 候选机场：OFP 里有天气的 + 分类表里的 ---------------- */
const ROLE = { dep: '起飞', dest: '目的地', destAltn: '目的地备降', fuelEnroute: '加油', enroute: '航路' };
const ROLEE = { dep: 'DEP', dest: 'DEST', destAltn: 'Dest altn', fuelEnroute: 'Fuel', enroute: 'Enroute' };

let CAND = null, CANDK = '';
function candidates() {
  const o = S.ofp; if (!o) return [];
  const key = o.flight.no + o.flight.date + typeIdx() + (S.EK ? S.EK.n + (S.EK.at || '') : 0);
  if (CAND && CANDK === key) return CAND;

  const set = {}, ti = typeIdx(), EK = (S.EK && S.EK.ap) || {};
  Object.values(o.airports).forEach(a => { set[a.icao] = Object.assign({ ofp: true }, a); });
  Object.keys(EK).forEach(k => { if (!set[k] && EK[k].c[ti] !== '-' && S.AP[k]) set[k] = { icao: k, iata: EK[k].i, name: EK[k].n, roles: [], metar: [], taf: [] }; });
  CAND = Object.values(set).map(a => {

}

/* ---------------- 某机场在时间 t 的天气 / 跑道 / NOTAM ---------------- */
function assess(c, t) {
  const ref = S.ofp.flight.dateUTC + 12 * 3600e3;
  const M = c.metar && c.metar.length ? WX.metar(c.metar[c.metar.length - 1], ref) : null;
  const T = c.taf && c.taf.length ? WX.taf(c.taf[c.taf.length - 1], ref) : null;
  const w = (M || T) ? WX.at(T, M, t) : null;
  const notes = WX.notams(S.ofp.notams[c.icao], t);
  const closed = WX.closedRwys(S.ofp.notams[c.icao], t);
  const plannedRwy = (S.ofp.alternates.find(a => a.icao === c.icao) || {}).rwy || (c.icao === S.ofp.flight.arr ? (S.ofp.navlog[S.ofp.navlog.length - 1] || {}).rwy : null);
  const rw = c.db ? WX.runway(c.db[6], w && w.main.wind, closed, plannedRwy) : null;
  let rate = w ? WX.rate(w) : 'none';
  if (notes.some(n => n.lv === 'red' && /机场关闭|不能用作备降/.test(n.zh))) rate = 'red';
  else if (rw && rw.allLimited && rate === 'green') rate = 'amber';      // 每条跑道都有 NOTAM 限制
  return { w, rate, notes, rw, closed, src: w ? w.src : 'none' };
}

/* ---------------- 主循环 ---------------- */
function now() { return Date.now() + (S.sim || 0); }
// 起飞时间：有 ATD 用 ATD，否则用计划（STD + 滑行）
const tb = () => S.atd || ((S.ofp.times.std || S.ofp.flight.dateUTC) + (S.ofp.times.taxi || 15) * MIN);
// 手指位置 → 航路上最近的点 → 起飞后第几分钟
function snapRoute(ll) {
  const P = S.pts, Lp = S.line; if (!P || P.length < 2) return null;
  let best = 1e18, m = null;
  for (let i = 1; i < P.length; i++) {
    const a = Lp[i - 1], b = Lp[i]; let lng = ll.lng;
    while (lng - a[1] > 180) lng -= 360; while (lng - a[1] < -180) lng += 360;
    const k = Math.cos(a[0] * Math.PI / 180), ax = a[1] * k, ay = a[0], dx = b[1] * k - ax, dy = b[0] - ay, px = lng * k, py = ll.lat;
    const f = Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / (dx * dx + dy * dy || 1e-9)));
    const d = (ax + f * dx - px) ** 2 + (ay + f * dy - py) ** 2;
    if (d < best) { best = d; m = P[i - 1].t + f * (P[i].t - P[i - 1].t); }
  }
  return m;
}
function endPreview() { S.drag = null; S.dragging = false; S.follow = true; $('recenter').style.display = 'none'; lastList = 0; S.userScroll = 0; tick(); }

/* ---------------- 列表 ---------------- */
// 天气：主要一行 + 可能的情况（按语言）

}

    '<span class="nm">' + esc(c.iata || '') + ' ' + esc((c.db && c.db[2]) || c.name || '') + tags + '</span>' +

let lastList = 0;
function renderList(force) {

  let arr = candidates().map(c => { const d = distNm(p.pos, c.pos); return { c, d, mins: d / gs * 60 + (d > 40 ? 12 : 0) }; });
  let title = '';
  const usable = x => x.c.ek ? (catAt(x.c.ek, t0 + x.mins * MIN) || '-') !== '-' : x.c.ofp;
  const cur = currentAlts(arr, t0, usable);

  } else { arr = arr.filter(x => x.c.ofp).sort((a, b) => a.d - b.d); title = th('OFP 里有天气的机场 ' + arr.length + ' 个', arr.length + ' airports with OFP weather'); }

// 当前备降场：1 小时圈（410 nm）内能用的，按 天气 → 类别（D、A1、A2、CA、EA）→ 距离 排

function currentAlts(arr, t0, usable) {

function summary(cur, n2) {

// 地图：2 小时圈内能用的机场外圈变成青色；2 小时圈外的变淡
// 1 小时 / 2 小时圈内能用的机场：按公司类别上色（外圈 + 标签），一眼看出 D / A1 / A2 / CA / EA

// PDF → 按行还原文字（等宽排版，按 x 位置补空格）
async function pdfText(buf) {
  if (!window.pdfjsLib) await new Promise((ok, no) => { const s = document.createElement('script'); s.src = 'vendor/pdf.min.js'; s.onload = ok; s.onerror = () => no(new Error('PDF 组件没载入')); document.head.appendChild(s); });
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'vendor/pdf.worker.min.js';
  const doc = await pdfjsLib.getDocument({ data: buf }).promise;
  const pages = [];
  for (let n = 1; n <= doc.numPages; n++) {
    const pg = await doc.getPage(n), tc = await pg.getTextContent();
    const rows = {};
    let cw = 0, cn = 0;
    tc.items.forEach(it => { if (!it.str) return; const y = Math.round(it.transform[5] / 2) * 2; (rows[y] = rows[y] || []).push(it); if (it.str.trim().length > 2) { cw += it.width / it.str.length; cn++; } });
    cw = cn ? cw / cn : 6;
    const ys = Object.keys(rows).map(Number).sort((a, b) => b - a);
    const plines = [];
    ys.forEach(y => {
      let line = '';
      rows[y].sort((a, b) => a.transform[4] - b.transform[4]).forEach(it => {
        const col = Math.round(it.transform[4] / cw);
        if (col > line.length) line += ' '.repeat(col - line.length); else if (line && !/\s$/.test(line)) line += ' ';
        line += it.str;
      });
      plines.push(line);
    });
    // 去掉页面左边距（和电脑上复制出来的文字对齐）
    const ind = Math.min(...plines.filter(l => l.trim()).map(l => l.match(/^ */)[0].length));
    plines.forEach(l => pages.push(isFinite(ind) ? l.slice(ind) : l));
    $('msg').textContent = tt('正在读取 PDF…', 'Reading PDF…') + ' ' + n + '/' + doc.numPages;
  }
  return pages.join('\n');
}

$('updbar').onclick = () => $('b-upd').click();
$('b-force').onclick = async e => {
  e.preventDefault();
  if (!navigator.onLine) { toast(th('没有网络，不能重新下载', 'Offline — cannot re-download')); return; }
  if (!confirm(tt('重新下载整个网页？OFP、授权表和设置都会保留。', 'Re-download the whole app? OFP, table and settings are kept.'))) return;
  try { const rs = await navigator.serviceWorker.getRegistrations(); await Promise.all(rs.map(r => r.unregister())); const ks = await caches.keys(); await Promise.all(ks.map(k => caches.delete(k))); } catch (x) {}
  location.replace(location.pathname + '?r=' + Date.now());
};
$('b-upd').onclick = async () => {
  if (!navigator.onLine) { toast(th('没有网络，继续使用已保存的离线版本', 'Offline — keeping the saved version')); return; }
  if (!REG) { location.reload(); return; }
  toast(th('正在下载最新版本…', 'Downloading latest version…'), 60000);
  try { await REG.update(); } catch (e) {}
  if (REG.installing) await new Promise(res => { const w = REG.installing; w.addEventListener('statechange', () => { if (w.state === 'installed' || w.state === 'redundant') res(); }); setTimeout(res, 60000); });
  if (REG.waiting) { navigator.serviceWorker.addEventListener('controllerchange', () => location.reload()); REG.waiting.postMessage('skip'); return; }
  const c = navigator.serviceWorker.controller;
  if (!c) { location.reload(); return; }
  navigator.serviceWorker.addEventListener('message', e => {
    if (e.data === 'refreshed') location.reload();
    else if (/^refresh-failed/.test(e.data)) toast(th('下载失败，继续使用离线版本', 'Download failed — keeping offline version') + '<br><small>' + esc(e.data) + '</small>', 6000);
  });
  c.postMessage('refresh');
};

/* ---------------- 自动发给家里的时钟 ---------------- */
const APPV = 'v8';
const DEF_CLOCK = 'https://script.google.com/macros/s/AKfycbwZjFasB7wsS6EugQrDi-woVnfy-H7lh29Nf5Ia04Ksx5jrzrhLku_6kz6TiWIi5ZQe/exec';
const clockUrl = () => lsGet('clock') || DEF_CLOCK;
function planPayload() {
  const o = S.ofp, f = o.flight, P = S.pts || [];
  const pts = P.slice(1, -1).map(q => [q.pos[0], q.pos[1], q.t, q.dist]);
  const last = P[P.length - 1];
  return JSON.stringify({ digits: f.digits, date: f.date, depIata: f.depIata, arrIata: f.arrIata, reg: f.reg, trip: o.times.trip, taxi: o.times.taxi, gnd: last ? last.dist : o.times.groundDist, pts, atd: S.atd || null });
}
function syncStatus() {
  const ok = +lsGet('syncok') || 0, pend = lsGet('pending'), key = lsGet('key');
  $('syncst').innerHTML = !key ? '<span class="t-amber">' + th('还没填口令，暂时不会发送', 'No key yet — nothing will be sent') + '</span>'
    : pend ? '⏳ ' + th('等有网络时自动发送', 'Will send when online') : ok ? '✅ ' + th('已发给时钟', 'Sent to clock') + ' ' + hmZ(ok) : '';
}
let syncing = false;
async function syncClock(quiet) {
  if (!S.ofp) return;
  lsSet('pending', planPayload());
  await flushClock(quiet);
}
async function flushClock(quiet) {
  const body = lsGet('pending'), key = lsGet('key');
  syncStatus();
  if (!body || !key || syncing || !navigator.onLine) return;
  syncing = true;
  try {
    const r = await fetch(clockUrl() + (clockUrl().includes('?') ? '&' : '?') + 'k=' + encodeURIComponent(key), { method: 'POST', body });
    const t = await r.text();
    if (/^✅/.test(t)) { if (lsGet('pending') === body) { try { localStorage.removeItem('fa.pending'); } catch (e) {} } lsSet('syncok', Date.now()); if (!quiet) toast('🏠 ' + th('已发给家里的时钟', 'Sent to home clock') + '<br><small>' + esc(t) + '</small>', 5000); }
    else if (!quiet || /口令|key/i.test(t)) toast('🏠 ' + th('时钟没收下', 'Clock did not accept it') + '：' + esc(t.slice(0, 120)), 8000);
  } catch (e) { /* 没网或者被拦：留着下次再发 */ }
  syncing = false; syncStatus();
}
window.addEventListener('online', () => flushClock(true));
setInterval(() => { if (lsGet('pending')) flushClock(true); }, 5 * 60000);

/* ---------------- Today Brief ---------------- */
let briefFullMode = false;
const showBrief = () => { $('brief-pg').innerHTML = briefFullMode ? briefFull() : briefOne(); $('brief-pg').classList.toggle('one', !briefFullMode); };
$('b-brief').onclick = e => { e.preventDefault(); if (!S.ofp) { openLoad(); return; } showBrief(); $('brief').classList.add('open'); $('brief').scrollTop = 0; };
$('b-full').onclick = () => { briefFullMode = !briefFullMode; showBrief(); };
$('b-bclose').onclick = () => $('brief').classList.remove('open');
$('b-print').onclick = () => window.print();

/* ---------------- 开始 ---------------- */
Promise.all([apReady, ekReady]).then(() => {
  if (S.ofp) {
    $('t-fl').textContent = S.ofp.flight.no + ' · ' + S.ofp.flight.date;
    delete $('t-rt').dataset.i; $('t-rt').textContent = S.ofp.flight.dep + ' → ' + S.ofp.flight.arr + ' · ' + S.ofp.flight.reg + ' · STD ' + hmZ(S.ofp.times.std) + ' · TRIP ' + dur(S.ofp.times.trip);
    if (S.atd) $('atd').value = hmZ(S.atd).slice(0, 4);
    drawRoute();
  } else openLoad();
  tick(); setInterval(tick, 5000);
  flushClock(true);
});
// 测试用：?sim=分钟 把时间设到起飞后多少分钟
const SIM = new URLSearchParams(location.search).get('sim');
if (SIM != null) setTimeout(() => { if (S.ofp) { const at = (S.ofp.times.std || 0) + 20 * MIN; S.sim = at + (+SIM) * MIN - Date.now(); setATD(at); } }, 800);
</script>
