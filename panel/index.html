<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<title>Flight Panel</title>
<style>
/* 三色屏：永远白底，只用黑和红 */
:root{--bg:#fff;--fg:#000;--dim:#333;--line:#000;--red:#d00000;--amb:#000;--blue:#000;--grn:#000}
#main{display:flex;flex-direction:column;flex:1}
.ph.p0{color:var(--blue)}.ph.p1{color:var(--grn)}.ph.p2{color:var(--dim)}
.it.amb{border-color:#000}.ok.good{color:var(--grn)}
.c.w2{grid-column:span 2}
*{box-sizing:border-box}
input,textarea{-webkit-user-select:text!important;user-select:text!important}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:-apple-system,"Roboto","Noto Sans SC",sans-serif;-webkit-user-select:none;user-select:none}
#app{min-height:100vh;display:flex;flex-direction:column;padding:8px 12px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.tab{flex:0 0 auto;margin-right:6px;border:2px solid var(--line);border-radius:10px;padding:5px 9px;font-size:13px;font-weight:700;line-height:1.25;color:var(--dim)}
.tab.on{background:var(--fg);color:var(--bg)}
.tab small{display:block;font-weight:600;font-size:11px}
.fl{font-weight:900;line-height:.95;letter-spacing:-.02em;font-size:26vw;font-size:min(30vw,22vh);text-align:center;margin:4px 0 2px;white-space:nowrap}
.fl small{font-size:.45em;font-weight:800;margin-right:.08em}
.rt{text-align:center;font-size:6vw;font-size:min(7vw,5.5vh);font-weight:800}
.rt span{font-weight:500;color:var(--dim);font-size:.6em}
.ph{text-align:center;font-size:15px;font-weight:700;margin:4px 0 8px;color:var(--dim)}
.row{display:grid;grid-template-columns:1fr 1fr;border-top:2px solid var(--line)}
.c{padding:6px 6px;border-bottom:1px solid var(--line)}.c:nth-child(odd){border-right:1px solid var(--line)}
.l{font-size:11px;font-weight:700;color:var(--dim)}
.v{font-size:6vw;font-size:min(6.5vw,26px);font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums}
.s{font-size:12px;color:var(--dim);font-weight:600}
.edit{text-decoration:underline dotted}
.rk{flex:1;padding-top:8px}
.rk h3{margin:0 0 6px;font-size:15px}
.it{border-left:6px solid var(--dim);padding:5px 8px;margin-bottom:6px;font-size:16px;font-weight:700;line-height:1.35}
.it.red{border-color:var(--red);color:var(--red)}
.it small{display:block;font-weight:500;font-size:13px;color:var(--dim)}
.ok{color:var(--dim);font-size:15px;padding:6px 0}
#menu{display:none;flex-direction:column;gap:8px;padding:8px 0 4px;border-top:1px solid var(--line)}#menu.open{display:flex}#menu .btn{text-align:center;padding:10px}
.foot{display:flex;flex-wrap:nowrap;gap:8px;justify-content:space-between;align-items:center;padding-top:8px;font-size:13px;color:var(--dim)}
.btn{display:inline-block;margin:2px;cursor:pointer;border:2px solid var(--line);border-radius:10px;padding:7px 11px;font-weight:700;color:var(--fg);background:var(--bg);font-size:14px}
#set{display:none;position:fixed;top:0;right:0;bottom:0;left:0;background:var(--bg);z-index:9;padding:18px;font-size:15px;line-height:1.6;overflow:auto}
#set input{width:100%;font-size:17px;padding:8px;border:2px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);margin:4px 0 12px}
#empty{flex:1;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;font-size:16px;line-height:1.5}
@media (orientation:landscape){#main{flex-direction:row}.lh{width:48%;display:flex;flex-direction:column;justify-content:center;padding-right:10px;border-right:2px solid var(--line)}.rh{flex:1;padding-left:10px;overflow:hidden}.fl{font-size:12vw;font-size:min(13vw,38vh)}.lh{overflow:hidden}.rt{font-size:4vw}}
</style>
</head>
<body>
<div id="app">
  <div class="tabs" id="tabs"></div>
  <div id="main">
    <div class="lh"><div class="fl" id="fl"></div><div class="rt" id="rt"></div><div class="ph" id="ph"></div></div>
    <div class="rh"><div class="row" id="row"></div><div class="rk" id="rk"></div></div>
  </div>
  <div id="empty"></div>
  <div class="foot"><span id="st" style="flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></span><span class="btn" id="b-menu">☰</span></div>
  <div id="menu"><span class="btn" id="b-up">🔄 <span data-i="更新（读日历和邮箱）|Update (calendar & mail)"></span></span><span class="btn" id="b-mode"></span><span class="btn" id="b-lang"></span><span class="btn" id="b-set">⚙︎ <span data-i="设置|Settings"></span></span></div>
</div>
<div id="set">
  <b>⚙︎ <span data-i="设置|Settings"></span></b><br>
  <span data-i="口令（和飞行助手里填的一样）|Password (same as Flight Assist)"></span><br><input id="s-key" type="password" autocomplete="off">
  <span data-i="夜里背光亮度 5–30%（白天自动关，天黑慢慢亮起一点）|Night backlight 5–30% (off in daylight, fades up a little after dark)"></span><br><input id="s-bl" type="number" min="5" max="30">
  <span class="btn" id="s-ok">✓ <span data-i="保存|Save"></span></span> <span class="btn" id="s-x">✕</span>
  <p style="color:var(--dim)">有网时自动从邮箱读接下来 40 小时的 OFP（在 Lido 里把 OFP 发到邮箱即可），每 30 分钟查一次，也可以点「🔄 更新」。读完存在手机上，飞行中没网照常显示。<br>
  When online, OFPs for the next 40 h are read from your mailbox automatically (every 30 min, or tap Update). Everything is stored on the phone for offline use.</p>
  <p id="s-info" style="color:var(--dim);font-size:12px"></p>
</div>
<script src="vendor/pdf.min.js"></script>
<script src="ofp.js"></script>
<script src="wx.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id), MIN = 6e4, HOUR = 36e5;
const API = 'https://script.google.com/macros/s/AKfycbwZjFasB7wsS6EugQrDi-woVnfy-H7lh29Nf5Ia04Ksx5jrzrhLku_6kz6TiWIi5ZQe/exec';
const ls = (k, v) => { try { if (v === undefined) return localStorage.getItem('pnl.' + k); localStorage.setItem('pnl.' + k, v); } catch (e) { return null; } };
const p2 = n => String(n).padStart(2, '0');
const hmZ = t => { const d = new Date(t); return p2(d.getUTCHours()) + p2(d.getUTCMinutes()); };
const dmZ = t => { const d = new Date(t); return p2(d.getUTCDate()) + '/' + hmZ(t) + 'Z'; };
const T = kg => (kg / 1000).toFixed(1);
const dur = m => { m = Math.max(0, Math.round(m)); return Math.floor(m / 60) + 'h' + p2(m % 60); };
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, no) => setTimeout(() => no(new Error('timeout')), ms))]);
let LEGS = []; try { LEGS = JSON.parse(ls('legs') || '[]'); } catch (e) {}
let ROSTER = []; try { ROSTER = JSON.parse(ls('roster') || '[]'); } catch (e) {}   // Google 日历上的航班（不管有没有 OFP）
try { if (!ls('key') && window.AndroidPanel && AndroidPanel.presetKey) { const k = AndroidPanel.presetKey(); if (k) ls('key', k); } } catch (e) {}   // 个人版 App：口令已经装好
let MSG = '';
// 语言：zh 中文 / en English / both 中英
let LANG = ls('lang') || 'both';
const X = (z, e) => LANG === 'zh' ? z : LANG === 'en' ? e : z + ' · ' + e;
function applyLang() { document.querySelectorAll('[data-i]').forEach(el => { const a = el.dataset.i.split('|'); el.textContent = X(a[0], a[1]); }); }

/* =====================================================================
   1. 从邮箱读 OFP（Google；连不上就走 GitHub 转存，和飞行助手一样）
   ===================================================================== */
const postK = body => fetch(API + '?k=' + encodeURIComponent(ls('key') || ''), { method: 'POST', body: JSON.stringify(body) }).then(r => r.text()).then(t => { try { return JSON.parse(t); } catch (e) { return { ok: false, error: t.slice(0, 120) }; } });
const GH = () => ({ tok: ls('ghtok') || '', repo: ls('ghrepo') || 'chunhua1780/flight-box' });
async function listFiles() {
  if (ls('key')) { try { const j = await withTimeout(postK({ action: 'ofpmail', days: 3 }), 60000); if (j && j.ok) { if (j.gh && j.gh.tok) { ls('ghtok', j.gh.tok); ls('ghrepo', j.gh.repo || ''); } if (j.legs && j.legs.length) { ROSTER = j.legs; ls('roster', JSON.stringify(ROSTER)); } return j.files || []; } if (j && j.error && /key|口令|密码|denied/i.test(j.error)) { const er = new Error(X('口令不对', 'Wrong password')); er.pw = 1; throw er; } } catch (e) { if (e.pw) throw e; } }
  const g = GH(); if (!g.tok) throw new Error(ls('key') ? X('连不上 Google', 'Cannot reach Google') : X('先在 ⚙︎ 里填口令', 'Set the password in ⚙︎'));
  const r = await withTimeout(fetch('https://api.github.com/repos/' + g.repo + '/contents/ofp/index.json?_=' + Date.now(), { headers: { Authorization: 'Bearer ' + g.tok, Accept: 'application/vnd.github.raw+json' }, cache: 'no-store' }), 30000);
  if (!r.ok) throw new Error('GitHub ' + r.status);
  return (await r.json()).map(x => ({ id: 'gh:' + x.path, name: x.name, t: x.t, size: x.size }));
}
async function getFile(id) {
  if (/^gh:/.test(id)) { const g = GH(); const r = await fetch('https://api.github.com/repos/' + g.repo + '/contents/' + id.slice(3), { headers: { Authorization: 'Bearer ' + g.tok, Accept: 'application/vnd.github.raw+json' } }); if (!r.ok) throw new Error('GitHub ' + r.status); return new Uint8Array(await r.arrayBuffer()); }
  const a = await withTimeout(postK({ action: 'ofpget', id }), 120000); if (!a.ok || !a.b64) throw new Error(a.error || '下载失败');
  const b = atob(a.b64), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u;
}
// PDF → 等宽文字（和飞行助手同一个方法）
async function pdfText(u8, prog) {
  // App 里：PDF 解析放在主线程（WebView 的后台线程不一定能载入本地文件）
  if (window.AndroidPanel && !window.pdfjsWorker) await new Promise((ok, no) => { const s = document.createElement('script'); s.src = 'vendor/pdf.worker.min.js'; s.onload = ok; s.onerror = no; document.head.appendChild(s); });
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'vendor/pdf.worker.min.js';
  const doc = await pdfjsLib.getDocument({ data: u8, isEvalSupported: false, stopAtErrors: false }).promise, pages = [];
  for (let n = 1; n <= doc.numPages; n++) {
    const tc = await (await doc.getPage(n)).getTextContent(), rows = {}; let cw = 0, cn = 0;
    tc.items.forEach(it => { if (!it.str) return; const y = Math.round(it.transform[5] / 2) * 2; (rows[y] = rows[y] || []).push(it); if (it.str.trim().length > 2) { cw += it.width / it.str.length; cn++; } });
    cw = cn ? cw / cn : 6; const pl = [];
    Object.keys(rows).map(Number).sort((a, b) => b - a).forEach(y => { let line = '';
      rows[y].sort((a, b) => a.transform[4] - b.transform[4]).forEach(it => { const col = Math.round(it.transform[4] / cw); if (col > line.length) line += ' '.repeat(col - line.length); else if (line && !/\s$/.test(line)) line += ' '; line += it.str; });
      pl.push(line); });
    const ind = Math.min.apply(null, pl.filter(l => l.trim()).map(l => l.match(/^ */)[0].length));
    pl.forEach(l => pages.push(isFinite(ind) ? l.slice(ind) : l));
    if (prog) prog(n, doc.numPages);
  }
  return pages.join('\n');
}
const LIDO = /EK\.?\s?(\d{3,4})\.(\d{2})([A-Za-z]{3})(\d{4})\.([A-Z]{3})\.([A-Z]{3})/;
const MON = { JAN: 0, FEB: 1, MAR: 2, APR: 3, MAY: 4, JUN: 5, JUL: 6, AUG: 7, SEP: 8, OCT: 9, NOV: 10, DEC: 11 };
let busy = false;
async function update(quiet) {
  if (busy) return; if (!navigator.onLine) { MSG = '📵 ' + X('离线', 'Offline'); draw(); return; }
  if (!ls('key') && !GH().tok) { openSet(); return; }
  busy = true; MSG = '⏳ ' + X('查日历和邮箱…', 'Checking calendar & mail…'); draw();
  try {
    const files = await listFiles(), now = Date.now(), day0 = Date.UTC(new Date(now).getUTCFullYear(), new Date(now).getUTCMonth(), new Date(now).getUTCDate());
    // 每个航班只要最新的一份；日期在 昨天 ~ 后天（UTC）之间
    const best = {};
    files.forEach(f => { const m = LIDO.exec(f.name || ''); if (!m) return; const d = Date.UTC(+m[4], MON[m[3].toUpperCase()], +m[2]); if (d < day0 - 864e5 || d > day0 + 2 * 864e5) return;
      const k = m[1] + m[2] + m[3].toUpperCase() + m[5]; if (!best[k] || (f.t || 0) > (best[k].t || 0)) best[k] = f; });
    const want = Object.keys(best).map(k => best[k]); let got = 0;
    for (const f of want) {
      if (LEGS.some(l => l.fid === f.id)) continue;
      MSG = '⏳ ' + X('下载 ', 'Downloading ') + f.name.replace(/\.pdf$/i, ''); draw();
      const u8 = await getFile(f.id);
      const txt = await pdfText(u8, (n, N) => { if (n % 5 === 0 || n === N) { MSG = '⏳ ' + X('读取 ', 'Reading ') + n + '/' + N + ' · ' + f.name.slice(0, 16); draw(); } });
      const o = OFP.parse(txt); if (!o.ok) continue;
      const leg = summarize(o); leg.fid = f.id; leg.ft = f.t;
      LEGS = LEGS.filter(l => l.k !== leg.k).concat([leg]); got++;
      ls('legs', JSON.stringify(LEGS));
    }
    // 只留：还没落地超过 6 小时、40 小时以内起飞的
    LEGS = LEGS.filter(l => l.std + (l.tx + l.tr) * MIN > now - 6 * HOUR && l.std < now + 40 * HOUR).sort((a, b) => a.std - b.std);
    ls('legs', JSON.stringify(LEGS)); ls('upd', String(now));
    MSG = got ? '✅ ' + X('收到 ' + got + ' 份 OFP', got + ' OFP(s) received') : '✅ ' + X('已是最新', 'Up to date');
  } catch (e) { MSG = '⚠️ ' + e.message; }
  busy = false; draw();
}
const last4 = d => String(d || '').replace(/\D/g, '').slice(-4).replace(/^0+/, '');

/* =====================================================================
   2. 风险提醒：起飞前看起飞机场，航路上看各 FIR，下降前看目的地和备降场
   ===================================================================== */
const FIRN = [
  [/CONFLICT ZONE|HAZARDOUS SITUATION|SECURITY WARNING|MISSILE|ROCKET|HOSTILE|WEAPON|ARMED CONFLICT/, 'red', '冲突区 / 安全警告', 'Conflict zone / security warning'],
  [/VOLCANIC|\bVA\s+(CLOUD|ERUPTION)/, 'red', '火山灰', 'Volcanic ash'],
  [/(?:RTE|ROUTE|SEGMENT|AWY)S?\b[^.]{0,80}\bCLSD|AIRSPACE\s+CLSD|FIR\s+(?:IS\s+)?CLSD/, 'red', '航路 / 空域关闭', 'Route / airspace closed'],
  [/GNSS|\bGPS\b/, 'amber', 'GPS 干扰', 'GNSS interference'],
  [/(?:FREQ|HF)[^.]{0,120}\bU\/S\b|RADAR[^.]{0,80}(?:U\/S|NOT AVBL)|CPDLC[^.]{0,40}(?:U\/S|NOT AVBL)|ADS-C[^.]{0,40}NOT AVBL/, 'amber', 'ATC 频率 / 雷达部分不可用', 'ATC frequency / radar partly U/S'],
  [/\bBIRDS?\b[^.]{0,60}(?:ACTIVIT|MIGRAT|FLOCK|STRIKE)/, 'amber', '鸟群活动', 'Bird activity'],
  [/ARTILLERY|FIRING|\bEXER\b|MIL(?:ITARY)? EXERCISE|PARA DROP|DANGER AREA|DNG AREA|RESTRICTED AREA|PROHIBITED/, 'amber', '军事活动 / 限制区', 'Military activity / restricted area']
];
const FIRALIAS = { ZGGG: 'ZGZU', ZGNN: 'ZGZU', ZJSY: 'ZJSA', ZPPP: 'ZPKM', ZBAA: 'ZBPE', ZSSS: 'ZSHA', ZHHH: 'ZHWH', ZLLL: 'ZLHW', ZWWW: 'ZWUQ' };
function summarize(o) {
  const f = o.flight, t = o.times, W = o.weights || {}, F = o.fuel || {}, N = o.navlog || [], X = o.fixes || {};
  const off0 = t.std + (t.taxi || 0) * MIN, eta0 = off0 + (t.trip || 0) * MIN, ref = f.dateUTC + 12 * HOUR;
  const apRisk = (icao, at, role) => {
    const a = o.airports[icao] || {}, out = [];
    const M = a.metar && a.metar.length ? WX.metar(a.metar[a.metar.length - 1], ref) : null, Tf = a.taf && a.taf.length ? WX.taf(a.taf[a.taf.length - 1], ref) : null;
    const w = (M || Tf) ? WX.at(Tf, M, at) : null, rate = w ? WX.rate(w) : 'none';
    if (rate === 'red' || rate === 'amber') out.push({ lv: rate, zh: role[0] + ' ' + icao + ' 天气：' + WX.say(w, 'zh').join('；'), en: role[1] + ' ' + icao + ' weather: ' + WX.say(w, 'en').join('; ') });
    WX.notams(o.notams[icao], at).filter(n => n.lv !== 'info').slice(0, 5).forEach(n => out.push({ lv: n.lv, zh: role[0] + ' ' + icao + '：' + n.zh, en: role[1] + ' ' + icao + ': ' + n.en }));
    return out;
  };
  const leg = { k: f.no + f.date, no: f.no, date: f.date, dep: f.dep, arr: f.arr, ai: f.depIata, bi: f.arrIata, reg: f.reg || '', ty: f.type || '',
    std: t.std, tx: t.taxi || 0, tr: t.trip || 0, fl: (+(String(t.crzFl || '').replace(/\D/g, '')) || 350) * 100, n: N.map(w => [w.id, w.t]), fi: (o.firs || []).filter(x => x.wp).map(x => [x.name.replace(/ FIR$/, ''), x.code, x.wp, x.t]), c: [], R: { dep: [], enr: [], arr: [] } };
  const withC = N.filter(w => X[w.id]), step = Math.max(1, Math.ceil(withC.length / 12));
  withC.forEach((w, i) => { if (i % step === 0 || i === withC.length - 1) leg.c.push([w.t, Math.round(X[w.id][0] * 10) / 10, Math.round(X[w.id][1] * 10) / 10]); });
  // 重量
  if (W.ezfw && W.etow && W.elwt) {
    const z = W.ezfw[0], tof = (F.tof && F.tof.fuel) || (W.etow[0] - z), trip = (F.trip && F.trip.fuel) || (W.etow[0] - W.elwt[0]);
    const towL = Math.min(W.etow[1], W.rtow || 1e9), lwL = Math.min(W.elwt[1], W.rlwt || 1e9), tm = towL - (z + tof), lm = lwL - (z + tof - trip);
    leg.w = { tow: z + tof, towL, ldw: z + tof - trip, lwL, lf: tof - trip };
    if (tm < 2000) leg.R.dep.push({ lv: tm < 0 ? 'red' : 'amber', zh: '起飞重量余量只有 ' + T(tm) + ' t（限制 ' + T(towL) + ' t）', en: 'TOW margin ' + T(tm) + ' t (limit ' + T(towL) + ' t)' });
    if (lm < 2000) leg.R.arr.push({ lv: lm < 0 ? 'red' : 'amber', zh: '落地重量余量只有 ' + T(lm) + ' t（限制 ' + T(lwL) + ' t）', en: 'LDW margin ' + T(lm) + ' t (limit ' + T(lwL) + ' t)' });
  }
  leg.R.dep = leg.R.dep.concat(apRisk(f.dep, off0, ['起飞', 'DEP']));
  leg.R.arr = leg.R.arr.concat(apRisk(f.arr, eta0, ['目的地', 'DEST']));
  (o.alternates || []).forEach(a => apRisk(a.icao, eta0 + (a.time || 0) * MIN, ['备降', 'ALTN']).filter(x => x.lv === 'red' && (/天气/.test(x.zh) || /机场关闭|不能用作备降/.test(x.zh))).forEach(x => leg.R.arr.push(x)));
  // 航路：每个 FIR 进入前 20 分钟到离开
  leg.fi.forEach((x, i) => {
    const t0 = x[3], t1 = i + 1 < leg.fi.length ? leg.fi[i + 1][3] : leg.tr, code = FIRALIAS[x[1]] || x[1], seen = {};
    (o.notams[code] || []).forEach(n => {
      const a = off0 + t0 * MIN, b = off0 + t1 * MIN;
      if ((n.to != null && n.to < a - 30 * MIN) || (n.from != null && n.from > b + 30 * MIN)) return;
      const r = FIRN.find(q => q[0].test(n.text)); if (!r || seen[r[2]]) return; seen[r[2]] = 1;
      leg.R.enr.push([t0, t1, { lv: r[1], zh: x[0] + ' ' + x[1] + '：' + r[2], en: x[0] + ' ' + x[1] + ': ' + r[3] }]);
    });
  });
  return leg;
}

/* =====================================================================
   3. 白天 / 黑夜（太阳高度）和前光
   ===================================================================== */
function sunEl(t, lat, lon) {
  const r = Math.PI / 180, d = t / 864e5 - 10957.5, g = (357.529 + .98560028 * d) * r, q = 280.459 + .98564736 * d;
  const L = (q + 1.915 * Math.sin(g) + .02 * Math.sin(2 * g)) * r, e = (23.439 - 3.6e-7 * d) * r;
  const dec = Math.asin(Math.sin(e) * Math.sin(L)), ra = Math.atan2(Math.cos(e) * Math.sin(L), Math.cos(L));
  const gmst = (18.697374558 + 24.06570982441908 * d) % 24, ha = (gmst * 15 + lon) * r - ra;
  return Math.asin(Math.sin(lat * r) * Math.sin(dec) + Math.cos(lat * r) * Math.cos(dec) * Math.cos(ha)) / r;
}
function posAt(c, el) { if (!c || !c.length) return null; if (el <= c[0][0]) return c[0];
  for (let i = 1; i < c.length; i++) if (el <= c[i][0]) { const a = c[i - 1], b = c[i], k = (el - a[0]) / Math.max(1, b[0] - a[0]); return [el, a[1] + (b[1] - a[1]) * k, a[2] + (b[2] - a[2]) * k]; }
  return c[c.length - 1]; }
let MODE = ls('mode') || 'auto', lastBL = null;
const MODES = { auto: ['背光：自动', 'Backlight: auto', '💡 '], day: ['背光：关', 'Backlight: off', '○ '], night: ['背光：开', 'Backlight: on', '● '] };
// 背光：屏幕永远白底黑字。白天关；天黑了慢慢亮起一点点（默认 20%，最多 30%）
const BLMAX = 0.3, blPct = () => Math.max(5, Math.min(30, +(ls('blp') || 20))) / 100;
let blCur = 0, blIv = null;
function blApply(v) {
  try { if (window.AndroidPanel) AndroidPanel.setBrightness(v); } catch (e) {}
  try { if (window.fully && fully.setScreenBrightness) fully.setScreenBrightness(Math.round(v * 255)); } catch (e) {}
}
function setNight(n) {
  const target = n ? Math.min(BLMAX, blPct()) : 0;
  if (lastBL === target) return; lastBL = target; clearInterval(blIv);
  // 慢慢变：大约 3 秒，分 12 步
  const from = blCur, steps = 12; let k = 0;
  blIv = setInterval(() => { k++; blCur = from + (target - from) * k / steps; blApply(Math.max(0, Math.min(BLMAX, blCur))); if (k >= steps) clearInterval(blIv); }, 250);
}
// 飞机此刻的高度（英尺）：地面 0；起飞后 20 分钟爬到巡航高度；落地前 30 分钟开始下降
function altAt(L, ph, el) {
  const cr = L.fl || 35000; if (ph !== 1) return 0;
  if (el < 20) return cr * el / 20; if (el > L.tr - 30) return cr * Math.max(0, L.tr - el) / 30; return cr;
}
// 天黑没有：太阳在地平线以下多少度。高空看得更远（地平线下沉），巡航时太阳"落山"更晚
function isDark(now, P, alt) { const dip = 1.06 * Math.sqrt(Math.max(0, alt)) / 60; return sunEl(now, P[1], P[2]) < -(dip + 2); }

/* =====================================================================
   4. 画
   ===================================================================== */
const atdOf = l => +(ls('atd.' + l.k) || 0);
// 日历上的航班 + 收到的 OFP 合在一起：有 OFP 的用 OFP（航路点、移交点、风险），没有的按日历时间走
function flights(now) {
  const out = [];
  ROSTER.filter(r => r.sta > now - 12 * HOUR && r.std < now + 4 * 864e5).forEach(r => {
    const o = LEGS.find(l => last4(l.no) === last4(r.digits) && (l.bi === r.dest || l.arr === r.dest) && Math.abs(l.std - r.std) < 12 * HOUR);
    out.push(o || { k: 'R' + last4(r.digits) + '-' + r.std, no: 'EK' + last4(r.digits), ai: r.origin, bi: r.dest, std: r.std, tx: 15, tr: Math.max(30, Math.round((r.sta - r.std) / MIN) - 25), noOfp: true });
  });
  LEGS.forEach(l => { if (!out.some(x => x.k === l.k)) out.push(l); });
  return out.sort((a, b) => a.std - b.std);
}
const offOf = l => atdOf(l) || l.std + (l.tx || 0) * MIN;
function pick(now, F) {
  F = F || flights(now); const pin = ls('pin'), p = pin && F.find(l => l.k === pin);
  return p || F.find(l => offOf(l) + l.tr * MIN + 60 * MIN > now) || F[F.length - 1];
}
const item = x => '<div class="it ' + (x.lv === 'red' ? 'red' : 'amb') + '">' + (x.lv === 'red' ? '⛔ ' : '⚠︎ ') + esc(LANG === 'en' ? x.en : x.zh) + (LANG === 'both' ? '<small>' + esc(x.en) + '</small>' : '') + '</div>';
const tile = (l, v, s, id, cls) => '<div class="c ' + (cls || '') + '"' + (id ? ' id="' + id + '"' : '') + '><div class="l">' + l + '</div><div class="v">' + v + '</div><div class="s">' + (s || '') + '</div></div>';
function draw() {
  const now = Date.now(), F = flights(now);
  $('b-mode').textContent = MODES[MODE][2] + X(MODES[MODE][0], MODES[MODE][1]); $('b-lang').textContent = '🌐 ' + ({ zh: '中文', en: 'English', both: '中文 + English' })[LANG];
  const u = +(ls('upd') || 0); $('st').textContent = MSG || ((u ? X('更新于 ', 'Updated ') + dmZ(u) + ' · ' : '') + hmZ(now) + 'Z');
  const L = pick(now, F);
  const tabs = F.map(l => '<span class="tab' + (L && l.k === L.k ? ' on' : '') + '" data-k="' + esc(l.k) + '">' + esc(l.no) + ' ' + esc(l.ai) + '→' + esc(l.bi) + (l.noOfp ? '' : ' 📄') + '<small>' + dmZ(l.std) + (ls('pin') === l.k ? ' · 📌' : '') + '</small></span>').join('');
  if ($('tabs').innerHTML !== tabs) $('tabs').innerHTML = tabs;
  if (!L) { $('main').style.display = 'none'; $('empty').style.display = 'flex';
    const eh = !ls('key') && !GH().tok ? '<div>' + X('填口令（和飞行助手里的一样）', 'Password (same as Flight Assist)') + '</div><input id="e-key" type="password" autocomplete="off" style="font-size:18px;padding:8px;width:80%;border:2px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)"><span class="btn" id="e-ok">✓ ' + X('保存并读取', 'Save') + '</span>' : X('还没有航班。有网时点 ☰ → 🔄 更新，读取日历和邮箱。', 'No flights yet — when online tap ☰ → Update.');
    if ($('empty').dataset.h !== eh) { $('empty').dataset.h = eh; $('empty').innerHTML = eh; }   // 不要每次重画（会把正在输入的口令清掉）
    const ek = $('e-ok'); if (ek) ek.onclick = () => { const v = $('e-key').value.trim(); if (!v) return; ls('key', v); MSG = ''; draw(); update(false); };
    setNight(MODE === 'night'); return; }
  $('main').style.display = 'flex'; $('empty').style.display = 'none';
  const std = L.std, off = offOf(L), on = off + L.tr * MIN, el = (now - off) / MIN;
  const m = /^([A-Z]+)(\d+)$/.exec(L.no) || [0, '', L.no];
  const fl = '<small>' + m[1] + '</small>' + m[2]; if ($('fl').innerHTML !== fl) $('fl').innerHTML = fl;
  $('rt').innerHTML = esc(L.ai) + ' → ' + esc(L.bi) + ' <span>' + (L.date ? esc(L.date) : dmZ(std)) + (L.reg ? ' · ' + esc(L.reg) : '') + '</span>';
  const ph = now < off ? 0 : now < on ? 1 : 2;
  $('ph').className = 'ph p' + ph;
  $('ph').textContent = ph === 0 ? (off - now > 12 * HOUR ? X('计划', 'Planned') + ' ' + dmZ(off) : X('起飞前 ' + dur((off - now) / MIN), 'T/O in ' + dur((off - now) / MIN))) : ph === 1 ? '✈ ' + X('已飞 ' + dur(el) + '，剩 ' + dur(L.tr - el), 'Flown ' + dur(el) + ', to go ' + dur(L.tr - el)) : X('已落地', 'Landed');
  const P = L.c && L.c.length ? (ph === 0 ? L.c[0] : ph === 2 ? L.c[L.c.length - 1] : posAt(L.c, el)) : null;
  setNight(MODE === 'night' || (MODE === 'auto' && P && isDark(now, P, altAt(L, ph, el))));
  // 信息格：STD/ATD（点了改）· ETA · 下一个点 · 下一个移交点
  let row = tile(atdOf(L) ? 'ATD ✎' : 'STD ✎', '<span class="edit">' + hmZ(atdOf(L) || std) + 'Z</span>', atdOf(L) ? 'STD ' + hmZ(std) + 'Z' : X('点这里填实际起飞', 'Tap to enter ATD'), 'c-atd');
  row += tile('ETA ' + esc(L.bi), hmZ(on) + 'Z', L.noOfp ? X('按日历', 'from roster') : 'Trip ' + dur(L.tr));
  if (L.noOfp) row += tile('OFP', '—', X('还没收到', 'not received'), '', 'w2');
  else {
    const N = L.n || [], nx = ph === 1 ? N.find(w => w[1] > el) : ph === 0 ? N[1] : null;
    row += tile(X('下一点', 'Next WPT'), nx ? esc(nx[0]) : '—', nx ? hmZ(off + nx[1] * MIN) + 'Z' + (ph === 1 ? ' · ' + dur(nx[1] - el) : '') : '');
    const FI = L.fi || [], fx = ph === 2 ? null : FI.find(f => f[3] > Math.max(0, el)), cur = ph === 1 ? FI.filter(f => f[3] <= el).slice(-1)[0] : null;
    row += tile(X('下一移交', 'Next FIR'), fx ? esc(fx[2]) : '—', fx ? hmZ(off + fx[3] * MIN) + 'Z → ' + esc(fx[0]) + (ph === 1 ? ' · ' + dur(fx[3] - el) : '') : (cur ? X('现在 ', 'Now ') + esc(cur[0]) : ''));
  }
  if ($('row').innerHTML !== row) $('row').innerHTML = row;
  // 提醒：按阶段
  let h;
  if (L.noOfp) h = '<div class="ok">' + X('收到这个航班的 OFP 后，会加上航路点、移交点和风险提醒。', 'Waypoints, FIR handovers and risks appear when the OFP arrives (email it from Lido).') + '</div>';
  else {
    let list, title;
    if (ph === 0 || el < 20) { title = '🛫 ' + X('起飞', 'Departure') + ' ' + L.ai; list = L.R.dep; }
    else if (ph === 1 && el < L.tr - 60) { title = '✈️ ' + X('航路', 'En route'); list = L.R.enr.filter(r => el >= r[0] - 20 && el <= r[1]).map(r => r[2]); }
    else { title = '🛬 ' + X('落地', 'Arrival') + ' ' + L.bi; list = L.R.arr; }
    h = '<h3>' + title + '</h3>' + (list.length ? list.map(item).join('') : '<div class="ok good">✓ ' + X('没有特别提醒', 'Nothing special') + '</div>');
    if (L.w && (ph === 0 || el >= L.tr - 60)) h += '<div class="s" style="margin-top:6px">' + (ph === 0 ? 'TOW ' + T(L.w.tow) + ' / ' + T(L.w.towL) + ' t · ' : '') + 'LDW ' + T(L.w.ldw) + ' / ' + T(L.w.lwL) + ' t · ' + X('落地油 ', 'LDG fuel ') + T(L.w.lf) + ' t</div>';
  }
  if ($('rk').innerHTML !== h) $('rk').innerHTML = h;   // 墨水屏：没变就不重画
}


/* ---------- 操作 ---------- */
$('tabs').onclick = e => { const t = e.target.closest('.tab'); if (!t) return; ls('pin', ls('pin') === t.dataset.k ? '' : t.dataset.k); draw(); };
$('row').onclick = e => {
  if (!e.target.closest('#c-atd')) return; const L = pick(Date.now()); if (!L) return;
  const v = prompt(L.no + ' 实际起飞 ATD（UTC，4 位，例如 0815；留空 = 按计划）\nActual T/O time (UTC, e.g. 0815; empty = plan)', atdOf(L) ? hmZ(atdOf(L)) : ''); if (v === null) return;
  if (!/^\d{4}$/.test(v.trim())) ls('atd.' + L.k, '');
  else { const s = L.std, d0 = Date.UTC(new Date(s).getUTCFullYear(), new Date(s).getUTCMonth(), new Date(s).getUTCDate()) + (+v.slice(0, 2) * 60 + +v.slice(2)) * MIN;
    ls('atd.' + L.k, String([d0 - 864e5, d0, d0 + 864e5].sort((a, b) => Math.abs(a - s) - Math.abs(b - s))[0])); }
  draw();
};
$('b-menu').onclick = () => $('menu').classList.toggle('open');
$('menu').addEventListener('click', e => { if (e.target.closest('.btn')) setTimeout(() => $('menu').classList.remove('open'), 300); });
$('b-lang').onclick = () => { LANG = LANG === 'both' ? 'zh' : LANG === 'zh' ? 'en' : 'both'; ls('lang', LANG); MSG = ''; applyLang(); $('rk').innerHTML = ''; draw(); };
$('b-up').onclick = () => update(false);
$('b-mode').onclick = () => { MODE = MODE === 'auto' ? 'day' : MODE === 'day' ? 'night' : 'auto'; ls('mode', MODE); draw(); };
function openSet() { $('s-key').value = ls('key') || ''; $('s-bl').value = ls('blp') || 20; $('s-info').textContent = navigator.userAgent; $('set').style.display = 'block'; }
$('b-set').addEventListener('click', openSet); $('s-x').onclick = () => { $('set').style.display = 'none'; };
$('s-ok').onclick = () => { ls('key', $('s-key').value.trim()); ls('blp', String(Math.max(5, Math.min(30, +$('s-bl').value || 20)))); lastBL = null; $('set').style.display = 'none'; draw(); update(false); };

/* ---------- 屏幕常亮（网页版用；App 自己会常亮） ---------- */
let wl = null;
async function wake() { try { if ('wakeLock' in navigator && document.visibilityState === 'visible' && !wl) { wl = await navigator.wakeLock.request('screen'); wl.addEventListener('release', () => { wl = null; }); } } catch (e) {} }
document.addEventListener('visibilitychange', () => { wake(); draw(); });
document.addEventListener('click', wake);
window.addEventListener('online', () => update(true));

applyLang(); draw(); wake(); setInterval(draw, 60000);   // 一分钟更新一次（省电）
// 有网：打开时、之后每 30 分钟自动读邮箱
setTimeout(() => { if (Date.now() - +(ls('upd') || 0) > 10 * MIN) update(true); }, 1500);
setInterval(() => { if (Date.now() - +(ls('upd') || 0) > 30 * MIN) update(true); }, 5 * MIN);
if (!window.AndroidPanel && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
