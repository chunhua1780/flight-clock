<html lang="zh">
<head>

<link rel="manifest" href="manifest.json">
<title>Flight Panel</title>
<style>
/* 三色屏：永远白底，只用黑和红（灰色只用在地图的陆地上） */
:root{--bg:#fff;--fg:#000;--dim:#333;--line:#000;--red:#d00000}
*{box-sizing:border-box}
input,textarea{-webkit-user-select:text!important;user-select:text!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:-apple-system,"Roboto","Noto Sans SC",sans-serif;-webkit-user-select:none;user-select:none;overflow:hidden}
#app{height:100vh;display:flex;flex-direction:column}
#top{height:19vh;display:flex;flex-direction:column;gap:2px;padding:4px 8px 3px;border-bottom:1px solid #ccc}
#sel{flex:1;display:flex;align-items:center;justify-content:center;cursor:pointer;min-height:0;overflow:hidden}
.fl{font-weight:900;line-height:.9;letter-spacing:-.03em;white-space:nowrap}
.fl small{font-size:.42em;font-weight:800;margin-right:.04em}
.fl .dd{font-size:.3em;color:var(--red)}
#tinfo{flex:none;display:flex;flex-direction:column;gap:1px}
.rt{font-size:15px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt span{font-weight:600;color:var(--dim);font-size:12px}
.ph{font-size:15px;font-weight:800;color:var(--red)}
#legs{display:none;margin:0 8px 4px;border:2px solid var(--line);border-radius:10px;max-height:45vh;overflow:auto;background:#fff;position:relative;z-index:5}#legs.open{display:block}
.lg{padding:8px 10px;border-bottom:1px solid #999;font-size:15px;font-weight:700}.lg:last-child{border-bottom:0}.lg.on{background:#000;color:#fff}.lg small{font-weight:500;font-size:12px}
.row{display:grid;grid-template-columns:auto 1fr auto 1fr;column-gap:6px;row-gap:0;align-items:baseline}
.c{display:contents}
.l{font-size:12px;font-weight:800;color:var(--dim)}
.v{font-size:18px;overflow:hidden;text-overflow:ellipsis;font-weight:900;line-height:1.05;white-space:nowrap;font-variant-numeric:tabular-nums}
.v .s{font-size:12px;font-weight:600;color:var(--dim)}
.edit{text-decoration:underline dotted}
#main{flex:1;min-height:0;display:flex;position:relative}
#mapw{flex:1;position:relative;min-width:0}
#map{width:100%;height:100%;display:block}
.zb{position:absolute;right:8px;width:36px;height:36px;border-radius:18px;background:rgba(255,255,255,.85);border:1.5px solid #333;font-size:22px;font-weight:900;text-align:center;line-height:32px}
#board{position:absolute;inset:0;display:none;background:#fff;overflow:auto;padding:8px 10px}#board h3{margin:6px 0 4px;font-size:16px}#board .bw{font-size:15px;font-weight:800;margin:6px 0}
#demob{position:absolute;left:30px;top:6px;display:none;background:#0a8a3a;color:#fff;font-weight:900;font-size:13px;padding:5px 12px;border-radius:14px;z-index:3}
#warn{position:absolute;left:0;top:38%;display:none;background:var(--red);color:#fff;font-weight:900;font-size:18px;padding:10px 10px 10px 6px;border-radius:0 14px 14px 0}
#wpop{position:absolute;left:8px;right:8px;bottom:50px;display:none;background:#fff;border:3px solid var(--red);border-radius:12px;padding:6px 8px;max-height:55%;overflow:auto;box-shadow:0 4px 16px rgba(0,0,0,.25)}
#wpop h3{margin:0 0 4px;font-size:14px;color:var(--red)}
.fab{position:absolute;left:8px;bottom:8px;width:40px;height:40px;border-radius:20px;background:rgba(255,255,255,.9);border:1.5px solid #333;font-size:20px;font-weight:900;text-align:center;line-height:36px}
#st{position:absolute;left:54px;right:56px;bottom:12px;font-size:11.5px;color:#444;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 0 3px #fff,0 0 3px #fff}
.it{border-left:5px solid #000;padding:3px 7px;margin-bottom:4px;font-size:14px;font-weight:700;line-height:1.3}
.it.red{border-color:var(--red);color:var(--red)}
.it small{display:block;font-weight:500;font-size:12px;color:var(--dim)}
.it .go{float:right;font-size:12px;border:1px solid currentColor;border-radius:7px;padding:0 5px;margin-left:5px}
.ok{color:var(--dim);font-size:14px;padding:4px 0}
#menu{display:none;flex-direction:column;gap:6px;padding:6px 8px;border-top:1px solid var(--line);background:#fff}#menu.open{display:flex}#menu .btn{text-align:center;padding:9px}
.btn{display:inline-block;margin:2px;cursor:pointer;border:2px solid var(--line);border-radius:10px;padding:6px 10px;font-weight:700;color:var(--fg);background:var(--bg);font-size:14px}
#set,#sheet{display:none;position:fixed;top:0;right:0;bottom:0;left:0;background:var(--bg);z-index:9;padding:14px;font-size:15px;line-height:1.55;overflow:auto}
#set input{width:100%;font-size:17px;padding:8px;border:2px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);margin:4px 0 12px}
.nt{border:1px solid #000;border-radius:10px;padding:8px 10px;margin:8px 0}.nt.red{border:2px solid var(--red)}
.nt .id{font-weight:900}.nt .tm{font-size:12px;color:var(--dim)}.nt .zh{font-size:15px;font-weight:700;margin-top:4px}.nt .en{font-size:12.5px;color:var(--dim);margin-top:4px;font-family:ui-monospace,Menlo,monospace}
.mb{display:inline-block;margin-top:6px;border:2px solid var(--red);color:var(--red);border-radius:8px;padding:2px 9px;font-weight:800;font-size:13px}.mb.on{background:var(--red);color:#fff}
#empty{flex:1;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;font-size:16px;line-height:1.5}
#side{width:31%;min-width:100px;max-width:200px;display:flex;flex-direction:column;border-left:1px solid #bbb;min-height:0}
#demob{top:56px;left:8px}
#fhdr{flex:none;padding:3px 5px;border-bottom:1px solid #bbb;font-size:11.5px;line-height:1.25;font-weight:700}#fhdr:empty{display:none}#fhdr b{font-weight:900}
#fhdr .fc{display:block;color:#000}#fhdr .fn{display:block;color:#c25a00}
/* 航路点时间线：灰色细线 + 圆圈。下一个点 = 绿色实心圆；移交点 = 橙色圆圈，旁边写下一个管制区 */
#wpl{flex:1;overflow-y:auto;font-size:13px;background:linear-gradient(#bbb,#bbb) 10px 0/2px 100% no-repeat}
.wp{position:relative;padding:3px 4px 3px 22px;line-height:1.15;font-weight:800}
.wp i{position:absolute;left:5px;top:5px;width:12px;height:12px;border-radius:50%;border:2px solid #000;background:#fff;box-sizing:border-box}
.wp .n{font-size:14px}.wp .d{float:right;font-size:11px;font-weight:700;color:#444;font-variant-numeric:tabular-nums}
.wp .t{display:block;font-size:11px;font-weight:600;color:#444;font-variant-numeric:tabular-nums}
.wp.past{color:#aaa;font-weight:500}.wp.past .t{color:#aaa}.wp.past i{border-color:#bbb}
.wp.ho i{border:3px solid #e07000;width:14px;height:14px;left:4px}
.wp .hl{display:block;font-size:11px;font-weight:800;color:#c25a00;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.wp .hl b{font-weight:900}
.wp.soon .hl{background:#e07000;color:#fff;border-radius:4px;padding:0 3px}
.wp.nx{background:#eaf7ee}.wp.nx i{background:#0a8a3a;border-color:#0a8a3a;width:16px;height:16px;left:3px;top:4px}.wp.nx.ho i{border:3px solid #e07000}
.wp.nx .n{font-size:17px;font-weight:900}.wp.nx .t{color:#0a6a2c;font-weight:800}
.wmore{padding:3px 4px 3px 22px;font-size:12px;color:#888;font-weight:700}
/* 警告：独立弹出卡片（没有警告就不显示） */
#alc{display:none;position:absolute;left:8px;right:52px;bottom:56px;max-height:58%;overflow:hidden;background:#fff;border:3px solid var(--red);border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.25);z-index:4}
#alc .ah{display:flex;align-items:center;padding:4px 8px;background:var(--red);color:#fff;font-size:14px}#alc .ah b{flex:1}#alc .ax{font-size:20px;font-weight:900;padding:0 4px;cursor:pointer}
#alx{max-height:calc(58vh - 40px);overflow-y:auto;padding:4px;font-size:12.5px}
#alx .it{margin:3px 0}.alh{font-size:12px;font-weight:900;margin:5px 2px 2px}
.al{padding:4px 6px;border:1px solid #bbb;border-radius:8px;margin:3px 0;line-height:1.2}.al b{font-weight:900}.al .aw{float:right;font-weight:800;font-variant-numeric:tabular-nums}
.al .at{font-weight:700;margin-top:2px}.al .at small{display:block;font-weight:500;color:#444}.al .am{font-size:11px;color:#444;margin-top:2px}
.al.warning{background:var(--red);color:#fff;border-color:var(--red)}.al.warning .am,.al.warning .at small{color:#fff}.al.caution{border-left:6px solid var(--red);color:var(--red)}.al.info{border-left:6px solid #000}
.ack-b{float:right;border:1.5px solid currentColor;border-radius:7px;padding:0 6px;font-weight:900}
#warn{left:auto;right:8px;top:auto;bottom:56px;border-radius:14px;padding:6px 10px;font-size:15px;z-index:3}
#firl{position:absolute;left:8px;top:8px;z-index:2;background:rgba(255,255,255,.88);border:1.5px solid #e07000;color:#a34a00;border-radius:7px;padding:1px 7px;font-size:12px;font-weight:900;white-space:nowrap;max-width:calc(100% - 60px);overflow:hidden;text-overflow:ellipsis}#firl:empty{display:none}
#gpsb{position:absolute;left:8px;top:32px;z-index:2;font-size:11px;font-weight:900;border-radius:6px;padding:0 5px;background:#fff;border:1.5px solid #000}#gpsb:empty{display:none}#gpsb.gps{background:#0a8a3a;color:#fff;border-color:#0a8a3a}
#hov{font-size:13px;font-weight:800;color:#c25a00;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#hov:empty{display:none}
.lbr{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0}.lbt{border:1.5px solid #000;border-radius:7px;padding:1px 6px;font-weight:800;font-variant-numeric:tabular-nums}.lbt i{font-style:normal;font-size:11px;font-weight:600;color:#444;margin-right:3px}.lbt sup{color:#888}
@media (orientation:landscape){#top{height:30vh;flex-direction:row;align-items:center}#sel{flex:1.3}#tinfo{flex:1}}

@media (orientation:landscape) and (min-width:700px){
#top{height:26vh;padding:4px 12px;gap:14px}#sel{flex:1.15;justify-content:flex-start}#tinfo{flex:1;justify-content:center}
#main{flex-direction:row-reverse}#side{width:17%;min-width:118px;max-width:190px;border-left:0;border-right:1px solid #bbb}
.wp .t{font-size:10.5px}.wp .n{font-size:13px}.wp.nx{padding-top:6px;padding-bottom:6px}.wp.nx .n{font-size:22px}.wp.nx .t{font-size:13px}.wp.nx i{width:20px;height:20px;left:1px;top:9px}
#fhdr{font-size:12px}#alc{left:auto;right:56px;top:10px;bottom:auto;width:min(380px,45%);max-height:70%}#alx{max-height:calc(70vh - 60px)}
#warn{top:10px;bottom:auto;right:56px}#legs{position:fixed;left:8px;top:8px;width:45%;z-index:8}#menu{position:fixed;left:0;right:0;bottom:0;z-index:8}}
/* ====== 2026-11-19 版面：竖屏 ====== */
#top{height:24vh;flex-direction:row;align-items:stretch;gap:6px;padding:4px 6px 4px 8px}
#sel{flex:2.3;justify-content:flex-start;align-items:center}
#tinfo{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:2px;border-left:1px solid #ccc;padding-left:6px}
.rt{white-space:normal;line-height:1.15}.rt .rr{display:block;font-size:16px;font-weight:900}.rt .rc{display:block;font-size:11px;font-weight:600;color:#444}#phx{display:block;font-size:12.5px;color:var(--red);font-weight:800}
.row{grid-template-columns:auto 1fr;column-gap:5px}.row .l{font-size:10.5px}.row .v{font-size:16px}.row .v .s{font-size:10.5px}
#hov{display:none}
#side{width:27%;min-width:0;max-width:none}
#wpl{background:none;flex:none;overflow:hidden}
#sinfo{flex:1;min-height:0;overflow-y:auto;border-top:2px solid #000;font-size:10.5px;line-height:1.25}#sinfo:empty{border-top:0}
.si{padding:3px 4px;border-bottom:1px solid #ccc;font-weight:700}.si b{font-weight:900}.si span{display:block;font-weight:600;color:#444}
.si.ho{color:#c25a00}.si.ho span{color:#c25a00}.si.soon{background:#e07000;color:#fff}.si.soon span{color:#fff}
.si.warning{background:var(--red);color:#fff}.si.warning span{color:#fff}.si.caution{color:var(--red);border-left:4px solid var(--red)}.si.info{border-left:4px solid #000}.si.ack{color:#999;background:#fff;border-left:4px solid #ccc}.si.ack span{color:#999}
.si.ofp{font-weight:700;color:#000}
.wp{display:flex;align-items:center;gap:3px;padding:3px 3px;line-height:1.1;font-weight:800;position:static}
.bx{flex:none;display:inline-flex;flex-direction:column;align-items:center;min-width:50px;max-width:60%;border:2.5px solid #1f4e9c;border-radius:9px;padding:1px 4px;font-size:13.5px;font-weight:900;color:#000;background:#fff}
.bx .n{white-space:nowrap}
.wp.ho .bx{border-color:#e07000;border-width:3px}
.hf{position:relative;display:block;width:100%;height:1.25em;font-size:9.5px;font-weight:900;color:#c25a00;overflow:hidden}
.h1,.h2{position:absolute;left:0;right:0;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:hfa 5s steps(1) infinite}.h2{animation-delay:-2.5s}
@keyframes hfa{0%{opacity:1}50%{opacity:0}}
.wp.nx .bx{border:3.5px solid #0a8a3a;background:#eaf7ee;font-size:15px;padding:2px 4px}.wp.nx.ho .bx{box-shadow:0 0 0 3px #e07000}
.wp.past .bx{border-color:#ccc;color:#aaa}.wp.past .hf{color:#bbb}
.wp .m{flex:1;min-width:0;text-align:right;font-size:9px;white-space:nowrap;overflow:hidden;font-weight:600;color:#444;line-height:1.2;font-variant-numeric:tabular-nums}.wp .m .t{display:block;font-size:11px;font-weight:800;color:#000}
.wp.nx .m .t{color:#0a6a2c;font-size:13px}.wp.past .m,.wp.past .m .t{color:#aaa}
#fhdr .fc,#fhdr .fn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 警告：竖屏在右边栏的下半部分弹出 */
#alc{position:fixed;left:4px;right:calc(27% + 4px);width:auto;top:auto;bottom:54px;max-height:40vh;border-radius:12px;z-index:6;display:none}
.wp .m .tg{display:none}
#alx{max-height:calc(42vh - 36px);height:auto;overflow-y:auto;font-size:12px}#alx .it{font-size:12.5px}
#warn{position:fixed;left:auto;right:calc(27% + 8px);bottom:56px;top:auto;z-index:6;border-radius:14px;padding:6px 10px;font-size:15px}
/* ====== 横屏：上半部分左边 = 航班号框（独立）；右边 = 弹出的警告；下面 = 窄航路点栏 + 地图 ====== */
@media (orientation:landscape) and (min-width:700px){
#top{height:30vh;width:57%;margin:6px 0 4px 6px;border:2.5px solid #000;border-radius:14px;padding:6px 10px;gap:10px}
#sel{flex:1.5}#tinfo{flex:1}.rt .rr{font-size:20px}.row .v{font-size:20px}.row .l{font-size:12px}#phx{font-size:15px}#hov{display:block;font-size:13px}
